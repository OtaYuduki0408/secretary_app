<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>命令編集</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f6f8fa;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }
    .section {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin: 20px auto;
      padding: 20px;
      max-width: 800px;
    }
    .section h2 {
      font-size: 18px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0;
    }
    input[type="text"], select {
      flex: 1;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover { background: #005fa3; }
    .remove { background: #e74c3c; }
    .remove:hover { background: #c0392b; }
    #save {
      display: block;
      margin: 20px auto;
      font-size: 16px;
      padding: 10px 20px;
      background: #2ecc71;
    }
    #save:hover { background: #27ae60; }
    .msg {
      text-align: center;
      color: #27ae60;
      font-weight: bold;
      margin-top: 10px;
    }
    .command-btn {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      background: #f0f0f0;
      padding: 6px 10px;
      border-radius: 5px;
    }
    .command-btn button {
      background: #e74c3c;
      padding: 3px 6px;
    }
    .command-btn button:hover { background: #c0392b; }
  </style>
</head>
<body>
  <h1>命令編集</h1>

  <!-- 命令名 -->
  <div class="section">
    <h2>命令名</h2>
    <input type="text" id="command-name" placeholder="例：朝の挨拶" />
  </div>

  <!-- トリガー -->
  <div class="section" id="trigger-section">
    <h2>トリガー</h2>
    <div id="trigger-list"></div>
    <button id="add-trigger">＋ トリガーを追加</button>
  </div>

  <!-- 条件 -->
  <div class="section" id="condition-section">
    <h2>条件</h2>
    <div id="condition-list"></div>
    <button id="add-condition">＋ 条件を追加</button>
  </div>

  <!-- 破壊条件 -->
  <div class="section" id="break-condition-section">
    <h2>破壊条件（ループ停止条件）</h2>
    <div id="break-condition-list"></div>
    <button id="add-break-condition">＋ 破壊条件を追加</button>
  </div>

  <!-- ループ設定 -->
  <div class="section" id="loop-section">
    <h2>ループ設定</h2>
    <div class="item">
      <label>繰り返し回数：</label>
      <select id="loop-count">
        <option value="once">1回のみ</option>
        <option value="3">3回</option>
        <option value="5">5回</option>
        <option value="10">10回</option>
        <option value="infinite">無限</option>
      </select>
    </div>
  </div>

  <!-- アクション -->
  <div class="section" id="action-section">
    <h2>アクション</h2>
    <div id="action-list"></div>
    <button id="add-action">＋ アクションを追加</button>
  </div>

  <button id="save">💾 保存</button>
  <div class="msg" id="message"></div>
  <div class="section" id="existing-commands">
    <h2>既存命令一覧</h2>
  </div>

  <script>
    const nameInput = document.getElementById("command-name");
    const loopSelect = document.getElementById("loop-count");
    const triggerList = document.getElementById("trigger-list");
    const conditionList = document.getElementById("condition-list");
    const breakList = document.getElementById("break-condition-list");
    const actionList = document.getElementById("action-list");
    const existingCommands = document.getElementById("existing-commands");
    const msgBox = document.getElementById("message");

    function createTrigger(trigger={type:"manual", value:""}) {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <select class="trigger-type">
          <option value="time">時間</option>
          <option value="voice">音声</option>
          <option value="manual">手動</option>
        </select>
        <input type="text" placeholder="値" class="trigger-value">
        <button class="remove">削除</button>
      `;
      div.querySelector(".trigger-type").value = trigger.type;
      div.querySelector(".trigger-value").value = trigger.value || "";
      div.querySelector(".remove").onclick = () => div.remove();
      triggerList.appendChild(div);
    }

    function createCondition(cond={expr:""}) {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <input type="text" placeholder="条件式" class="condition-expr">
        <button class="remove">削除</button>
      `;
      div.querySelector(".condition-expr").value = cond.expr || "";
      div.querySelector(".remove").onclick = () => div.remove();
      conditionList.appendChild(div);
    }

    function createBreakCondition(cond={expr:""}) {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <input type="text" placeholder="破壊条件式" class="break-expr">
        <button class="remove">削除</button>
      `;
      div.querySelector(".break-expr").value = cond.expr || "";
      div.querySelector(".remove").onclick = () => div.remove();
      breakList.appendChild(div);
    }

    function createAction(act={type:"speak", value:""}) {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <select class="action-type">
          <option value="speak">話す</option>
          <option value="display">表示</option>
          <option value="execute">コマンド実行</option>
        </select>
        <input type="text" placeholder="内容" class="action-value">
        <button class="remove">削除</button>
      `;
      div.querySelector(".action-type").value = act.type;
      div.querySelector(".action-value").value = act.value || "";
      div.querySelector(".remove").onclick = () => div.remove();
      actionList.appendChild(div);
    }

    document.getElementById("add-trigger").onclick = () => createTrigger();
    document.getElementById("add-condition").onclick = () => createCondition();
    document.getElementById("add-break-condition").onclick = () => createBreakCondition();
    document.getElementById("add-action").onclick = () => createAction();

    async function loadCommands() {
      const res = await fetch("/api/custom_orders");
      const commands = await res.json();
      existingCommands.innerHTML = "<h2>既存命令一覧</h2>";
      commands.forEach(cmd => {
        const div = document.createElement("div");
        div.className = "command-btn";
        const btnLoad = document.createElement("button");
        btnLoad.innerText = `${cmd.name} (ID:${cmd.id})`;
        btnLoad.onclick = () => loadCommandToEditor(cmd);
        const btnDel = document.createElement("button");
        btnDel.innerText = "削除";
        btnDel.onclick = async () => {
          if(confirm("本当に削除しますか？")){
            await fetch(`/api/custom_orders/${cmd.id}`, { method: "DELETE" });
            loadCommands();
          }
        };
        div.appendChild(btnLoad);
        div.appendChild(btnDel);
        existingCommands.appendChild(div);
      });
    }

    function loadCommandToEditor(cmd) {
      nameInput.value = cmd.name;
      loopSelect.value = cmd.loop_count || "once";
      triggerList.innerHTML = "";
      cmd.triggers.forEach(t=>createTrigger(t));
      conditionList.innerHTML = "";
      cmd.conditions.forEach(c=>createCondition(c));
      breakList.innerHTML = "";
      cmd.break_conditions.forEach(b=>createBreakCondition(b));
      actionList.innerHTML = "";
      cmd.actions.forEach(a=>createAction(a));
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("save").onclick = async () => {
      if(!nameInput.value.trim()){
        msgBox.innerText = "命令名は必須です";
        return;
      }
      const actions = Array.from(document.querySelectorAll(".action-type")).map((el,i)=>({
        type: el.value,
        value: document.querySelectorAll(".action-value")[i].value
      })).filter(a=>a.value.trim()!=="");
      if(actions.length === 0){
        msgBox.innerText = "少なくとも1つのアクションが必要です";
        return;
      }
      const data = {
        name: nameInput.value,
        loop_count: loopSelect.value,
        triggers: Array.from(document.querySelectorAll(".trigger-type")).map((el,i)=>({
          type: el.value,
          value: document.querySelectorAll(".trigger-value")[i].value
        })),
        conditions: Array.from(document.querySelectorAll(".condition-expr")).map(el=>({expr: el.value})),
        break_conditions: Array.from(document.querySelectorAll(".break-expr")).map(el=>({expr: el.value})),
        actions
      };
      try {
        const res = await fetch("/api/custom_orders", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(data)
        });
        const result = await res.json();
        msgBox.innerText = result.message || "保存完了！";
        setTimeout(()=>msgBox.innerText="", 3000);
        loadCommands();
      } catch(e){
        msgBox.innerText = "保存中にエラーが発生しました";
        console.error(e);
      }
    };

    window.onload = loadCommands;
  </script>

  <!-- 戻るボタン -->
  <div style="text-align:center; margin-top:30px;">
    <button
      onclick="window.location.href='/'"
      style="
        background:#555;
        color:white;
        border:none;
        border-radius:5px;
        padding:10px 20px;
        font-size:16px;
        cursor:pointer;
      "
    >
      ← 戻る
    </button>
  </div>
</body>
</html>
