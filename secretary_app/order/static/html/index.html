<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタム命令 | Secretary Automation</title>
  <link rel="stylesheet" href="/custom_order/static/css/index.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body class="co-body">
  <div class="co-shell">
    <header class="co-header">
      <a href="/" class="co-link-btn">← メインに戻る</a>
      <div class="co-header-copy">
        <p class="co-eyebrow">Automation Studio</p>
        <h1>カスタム命令</h1>
        <p class="co-subtitle">収支やカレンダーイベントをトリガーに、日々のルーティンを自動化しましょう。</p>
      </div>
    </header>

    <main class="co-layout">
      <section class="co-card co-form-card">
        <div class="co-section-head">
          <div>
            <p class="co-eyebrow">Flow Builder</p>
            <h2 class="co-section-title">命令の設定</h2>
          </div>
          <p class="co-section-desc">条件とアクションを組み合わせて理想のワークフローを構築します。</p>
        </div>

        <div class="co-fieldset">
          <label for="name">命令名</label>
          <input type="text" id="name" class="co-input" placeholder="例：朝の通知">
        </div>

        <div class="co-fieldset">
          <div class="co-fieldset-head">
            <h3>トリガー設定</h3>
            <p>カレンダーや収支状況など開始条件を選択します</p>
          </div>
          <div class="co-grid-two">
            <div class="co-field">
              <label for="trigger_category">カテゴリ</label>
              <select id="trigger_category" class="co-select"></select>
            </div>
            <div class="co-field">
              <label for="trigger_sub">詳細</label>
              <select id="trigger_sub" class="co-select"></select>
            </div>
          </div>
          <div id="trigger_value_container" class="co-dynamic-field">
            <input type="text" id="trigger_value" class="co-input" placeholder="値を入力（例：◯◯に到着）">
          </div>
        </div>

        <div class="co-fieldset">
          <div class="co-fieldset-head">
            <h3>条件設定</h3>
            <p>必要に応じて複数条件を積み上げられます</p>
          </div>
          <div id="condition_blocks" class="co-stack"></div>
          <button class="co-btn ghost add-button" id="add-condition" type="button">＋ 条件を追加</button>
        </div>

        <div class="co-fieldset">
          <div class="co-fieldset-head">
            <h3>アクション設定</h3>
            <p>実行タイミングと内容を調整</p>
          </div>
          <div class="co-grid-two">
            <div class="co-field">
              <label for="action_category">カテゴリ</label>
              <select id="action_category" class="co-select"></select>
            </div>
            <div class="co-field">
              <label for="action_sub">詳細</label>
              <select id="action_sub" class="co-select"></select>
            </div>
          </div>
          <div class="co-field co-action-timing">
            <label>実行タイミング <span>（空欄の場合は即時実行）</span></label>
            <div class="co-timing-grid">
              <input type="date" id="action_timing_date_abs" class="co-input" title="実行日（絶対）">
              <input type="number" id="action_timing_date_rel" class="co-input co-input--compact" placeholder="+n 日" title="実行日（相対）">
              <input type="time" id="action_timing_time_abs" class="co-input" title="実行時刻（絶対）">
              <input type="text" id="action_timing_time_rel" class="co-input co-input--compact" placeholder="+HH:MM:SS" title="実行時刻（相対）">
            </div>
          </div>
          <div id="action_detail_container" class="co-dynamic-field"></div>
        </div>

        <div class="co-actions">
          <button class="co-btn primary save-button" id="register-btn" type="button">💾 保存する</button>
          <p id="message" class="co-inline-message" role="status"></p>
        </div>
      </section>

      <section class="co-card co-list-card">
        <div class="co-section-head">
          <div>
            <p class="co-eyebrow">Library</p>
            <h2 class="co-section-title">既存命令一覧</h2>
          </div>
          <p class="co-section-desc">登録済みのフローをリアルタイムで編集・削除できます。</p>
        </div>
        <div id="command-list" class="co-command-list"></div>
      </section>
    </main>
  </div>
<script>
const TRIGGER_CATEGORIES = {
  "場所": [],
  "カレンダー": ["入力があったら", "予定の時間になったら"],
  "収支管理": ["入力があったら", "特定金額になったら"],
  "メモ": ["入力があったら"],
  "時間": []
};
console.log("TRIGGER_CATEGORIES:", TRIGGER_CATEGORIES);

const TRIGGER_VALUE_PLACEHOLDERS = {
  "場所": {
    "特定場所に近づいたら": "例: 東京駅",
  },
  "カレンダー": {
    "特定日付": "例: 2025-12-25",
    "曜日": "例: 月曜日",
    "予定がある": "例: 会議",
    "予定がない": "例: 終日"
  },
  "収支管理": {
    "残高が◯◯円以下": "例: 10000",
    "出費が◯◯円を超えた": "例: 5000",
    "収入があった": "例: 給料"
  },
  "メモ": {
    "メモに◯◯が追加された": "例: 買い物リスト",
    "特定キーワードが含まれた": "例: 重要"
  },
  "時間": {
    "特定時刻": "例: 07:00",
    "一定時間ごと": "例: 60 (分)"
  }
};
console.log("TRIGGER_CATEGORIES:", TRIGGER_CATEGORIES);
const ACTION_CATEGORIES = {
  "カレンダー": ["追加", "削除", "読み上げ"],
  "収支管理": ["読み上げ"],
  "メモ": ["読み上げ"],
  "メール": ["送信"]
};

function populateSelect(selectId, options) {
  console.log(`populateSelect called for ${selectId} with options:`, options);
  const select = document.getElementById(selectId);
  select.innerHTML = "<option value=''>選択してください</option>";
  for (const key in options) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = key;
    select.appendChild(opt);
  }
}

function updateSubOptions(categoryId, subId, data) {
  const prefix = categoryId.replace('trigger_category', '').replace('action_category', '');
  const cat = document.getElementById(categoryId).value;
  const sub = document.getElementById(subId);
  sub.innerHTML = "<option value=''>選択してください</option>";
  if (data[cat]) data[cat].forEach(v=>{ const o=document.createElement("option"); o.value=v;o.textContent=v; sub.appendChild(o); });

  if (categoryId.includes('trigger')) {
    if (cat === "場所" || cat === "メモ") {
      sub.style.display = 'none';
    } else if (cat === "時間") {
      sub.style.display = 'none';
    } else {
      sub.style.display = 'block';
    }
    createTriggerUI(prefix);
  } else {
    createActionUI(prefix);
  }
}

function createActionUI(prefix = '', initialValue = {}) {
  console.log(`createActionUI called with prefix: '${prefix}', initialValue:`, initialValue);
  const category = document.getElementById(`${prefix}action_category`).value;
  const sub = document.getElementById(`${prefix}action_sub`).value;
  const detailContainer = document.getElementById(`${prefix}action_detail_container`);
  detailContainer.innerHTML = '';

  switch (category) {
    case "カレンダー":
      if (sub === "追加" || sub === "削除") {
        detailContainer.innerHTML = `<textarea class="action-detail-cal-text" placeholder="内容">${initialValue.text || ''}</textarea>`;
      } else if (sub === "読み上げ") {
        detailContainer.innerHTML = `
          <label>読み上げ範囲(開始)</label>
          <input type="date" class="action-detail-cal-read-start-abs" title="開始日（絶対）" value="${initialValue.start_abs || ''}">
          <input type="number" class="action-detail-cal-read-start-rel" placeholder="+n 日" title="開始日（相対）" value="${initialValue.start_rel || ''}">
          <label>読み上げ範囲(終了)</label>
          <input type="date" class="action-detail-cal-read-end-abs" title="終了日（絶対）" value="${initialValue.end_abs || ''}">
          <input type="number" class="action-detail-cal-read-end-rel" placeholder="+n 日" title="終了日（相対）" value="${initialValue.end_rel || ''}">
        `;
      }
      break;
    case "収支管理":
      if (sub === "読み上げ") {
        detailContainer.innerHTML = `
          <label>読み上げ項目</label>
          <select class="action-detail-fin-read-item">
            <option value="total_balance" ${initialValue.item === 'total_balance' ? 'selected' : ''}>総所持金</option>
            <option value="remaining_to_target" ${initialValue.item === 'remaining_to_target' ? 'selected' : ''}>目標金額までの残金</option>
            <option value="monthly_expense" ${initialValue.item === 'monthly_expense' ? 'selected' : ''}>今月の支出</option>
            <option value="monthly_expense_no_necessities" ${initialValue.item === 'monthly_expense_no_necessities' ? 'selected' : ''}>今月の支出(必需品なし)</option>
            <option value="monthly_income" ${initialValue.item === 'monthly_income' ? 'selected' : ''}>今月の収入</option>
            <option value="daily_expense" ${initialValue.item === 'daily_expense' ? 'selected' : ''}>今日の支出</option>
            <option value="daily_expense_no_necessities" ${initialValue.item === 'daily_expense_no_necessities' ? 'selected' : ''}>今日の支出(必需品なし)</option>
          </select>
          <label>読み上げ形式</label>
          <select class="action-detail-fin-read-format">
            <option value="individual" ${initialValue.format === 'individual' ? 'selected' : ''}>個別</option>
            <option value="expense" ${initialValue.format === 'expense' ? 'selected' : ''}>支出</option>
            <option value="income" ${initialValue.format === 'income' ? 'selected' : ''}>収入</option>
            <option value="balance" ${initialValue.format === 'balance' ? 'selected' : ''}>収支</option>
          </select>
          <label>選択範囲(開始)</label>
          <input type="date" class="action-detail-fin-read-start-abs" title="開始日（絶対）" value="${initialValue.start_abs || ''}">
          <input type="number" class="action-detail-fin-read-start-rel" placeholder="+n 日" title="開始日（相対）" value="${initialValue.start_rel || ''}">
          <label>選択範囲(終了)</label>
          <input type="date" class="action-detail-fin-read-end-abs" title="終了日（絶対）" value="${initialValue.end_abs || ''}">
          <input type="number" class="action-detail-fin-read-end-rel" placeholder="+n 日" title="終了日（相対）" value="${initialValue.end_rel || ''}">
        `;
      }
      break;
    case "メモ":
      if (sub === "読み上げ") {
        detailContainer.innerHTML = `
          <label>読み上げ範囲(開始)</label>
          <input type="date" class="action-detail-memo-read-start-abs" title="開始日（絶対）" value="${initialValue.start_abs || ''}">
          <input type="number" class="action-detail-memo-read-start-rel" placeholder="+n 日" title="開始日（相対）" value="${initialValue.start_rel || ''}">
          <label>読み上げ範囲(終了)</label>
          <input type="date" class="action-detail-memo-read-end-abs" title="終了日（絶対）" value="${initialValue.end_abs || ''}">
          <input type="number" class="action-detail-memo-read-end-rel" placeholder="+n 日" title="終了日（相対）" value="${initialValue.end_rel || ''}">
        `;
      }
      break;
    case "メール":
      if (sub === "送信") {
        detailContainer.innerHTML = `
          <label>件名</label>
          <input type="text" class="action-detail-mail-subject" placeholder="メールの件名" value="${initialValue.subject || ''}">
          <label>本文</label>
          <textarea class="action-detail-mail-body" placeholder="メールの本文">${initialValue.body || ''}</textarea>
          <label>付与情報</label>
          <div class="action-detail-mail-attachment">
            <!-- ここにさらにUIが追加される -->
            <button type="button" class="add-attachment-btn">付与情報を追加</button>
          </div>
        `;
        // TODO: 付与情報追加ボタンのロジック
      }
      break;
  }
}

function createTriggerUI(prefix = '', initialValue = {}) {
  console.log(`createTriggerUI called with prefix: '${prefix}', initialValue:`, initialValue);
  const category = document.getElementById(`${prefix}trigger_category`).value;
  const sub = document.getElementById(`${prefix}trigger_sub`).value;
  const triggerValueContainer = document.getElementById(`${prefix}trigger_value_container`);
  triggerValueContainer.innerHTML = '';

  let defaultPlaceholder = "値";

  if (category) {
    switch (category) {
      case "場所":
        triggerValueContainer.innerHTML = `
          <label for="${prefix}trigger_value_address">住所</label>
          <input type="text" id="${prefix}trigger_value_address" class="trigger-input" placeholder="住所を入力してください" required value="${initialValue.address || ''}">
          <button type="button" id="${prefix}get_coords_btn" class="co-btn ghost" style="margin-top: 10px;">住所から緯度経度を取得</button><br>
          <label for="${prefix}trigger_value_latitude">緯度</label>
          <input type="text" id="${prefix}trigger_value_latitude" class="trigger-input" placeholder="緯度" readonly value="${initialValue.latitude || ''}">
          <label for="${prefix}trigger_value_longitude">経度</label>
          <input type="text" id="${prefix}trigger_value_longitude" class="trigger-input" placeholder="経度" readonly value="${initialValue.longitude || ''}">
          <label for="${prefix}trigger_value_range">許容範囲 (m)</label>
          <input type="number" id="${prefix}trigger_value_range" class="trigger-input" placeholder="許容範囲 (m)" required value="${initialValue.range || '1000'}">
          <small>注意: 許容範囲はなるべく幅広くしてください。(例：1000m等)</small>
          <div id="${prefix}location_message" style="color: green; margin-top: 5px;"></div>
          <div id="${prefix}location_error_message" style="color: red; display: none;">住所が特定できませんでした。「東京都千代田区」までなどより広い範囲を指定してください。</div>
          <div id="${prefix}map" style="height: 300px; margin-top: 10px;"></div>
        `;
        // mapとmarkerのインスタンスを保持する変数
        let map = null;
        let marker = null;

        // 既存の地図インスタンスがあれば破棄
        const existingMapElement = document.getElementById(`${prefix}map`);
        if (existingMapElement && existingMapElement._leaflet_id) {
            existingMapElement._leaflet_id = null; // Leafletの内部IDをクリア
            // Leafletのmapインスタンスを直接破棄
            if (window[`${prefix}leafletMap`]) {
                window[`${prefix}leafletMap`].remove();
                window[`${prefix}leafletMap`] = null;
            }
        }

        document.getElementById(`${prefix}get_coords_btn`).addEventListener("click", async () => {
          const addressInput = document.getElementById(`${prefix}trigger_value_address`);
          const address = addressInput ? addressInput.value : '';

          if (address && address.trim() !== '') {
            document.getElementById(`${prefix}location_message`).textContent = "緯度経度を取得中...";
            document.getElementById(`${prefix}location_error_message`).style.display = 'none';
            const result = await geocodeAddress(address);
            const locationErrorMessageElement = document.getElementById(`${prefix}location_error_message`);
            if (result && result.type === "success") {
              const lat = result.lat;
              const lng = result.lng;

              document.getElementById(`${prefix}trigger_value_latitude`).value = lat;
              document.getElementById(`${prefix}trigger_value_longitude`).value = lng;
              document.getElementById(`${prefix}location_message`).textContent = "緯度経度を正常に取得しました。";
              locationErrorMessageElement.style.display = 'none';

              // 地図の初期化または更新
              if (map === null) {
                map = L.map(`${prefix}map`).setView([lat, lng], 13);
                window[`${prefix}leafletMap`] = map; // グローバルに保存して後で参照できるようにする
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);
                marker = L.marker([lat, lng], {draggable: true}).addTo(map);

                marker.on('dragend', function(event) {
                  const newLatLng = marker.getLatLng();
                  document.getElementById(`${prefix}trigger_value_latitude`).value = newLatLng.lat.toFixed(6);
                  document.getElementById(`${prefix}trigger_value_longitude`).value = newLatLng.lng.toFixed(6);
                });
              } else {
                map.setView([lat, lng], 13);
                marker.setLatLng([lat, lng]);
              }
            } else {
              document.getElementById(`${prefix}trigger_value_latitude`).value = '';
              document.getElementById(`${prefix}trigger_value_longitude`).value = '';
              document.getElementById(`${prefix}location_message`).textContent = ""; // 取得中メッセージをクリア
              
              // エラーの種類に応じてメッセージを分岐
              if (result && (result.type === "api_error" || result.type === "network_error" || result.type === "malformed_response")) {
                locationErrorMessageElement.textContent = "使用APIにエラーが発生しております。時間を置いて再度お試しください。詳細：https://vldb.gsi.go.jp/sokuchi/surveycalc/main.html(国土地理院：ジオイド高計算　お知らせページ)";
              } else { // result.type === "no_coordinates" または result が null
                locationErrorMessageElement.textContent = "住所が特定できませんでした。都道府県、市区町村、番地までなど、より簡潔な形式でお試しください。";
              }
              locationErrorMessageElement.style.display = 'block';

              // 地図とマーカーをクリア
              if (map !== null) {
                map.remove();
                map = null;
                marker = null;
                window[`${prefix}leafletMap`] = null;
              }
            }
          } else {
            document.getElementById(`${prefix}location_error_message`).textContent = "住所を入力してください。";
            document.getElementById(`${prefix}location_error_message`).style.display = 'block';
            document.getElementById(`${prefix}location_message`).textContent = "";

            // 地図とマーカーをクリア
            if (map !== null) {
                map.remove();
                map = null;
                marker = null;
                window[`${prefix}leafletMap`] = null;
            }
          }
        });
        // 編集時の初期表示
        if (initialValue.latitude && initialValue.longitude) {
            const lat = parseFloat(initialValue.latitude);
            const lng = parseFloat(initialValue.longitude);

            if (!isNaN(lat) && !isNaN(lng)) {
                // 地図がまだ初期化されていない場合のみ初期化
                if (map === null) {
                    map = L.map(`${prefix}map`).setView([lat, lng], 13);
                    window[`${prefix}leafletMap`] = map;
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                    }).addTo(map);
                    marker = L.marker([lat, lng], {draggable: true}).addTo(map);

                    marker.on('dragend', function(event) {
                        const newLatLng = marker.getLatLng();
                        document.getElementById(`${prefix}trigger_value_latitude`).value = newLatLng.lat.toFixed(6);
                        document.getElementById(`${prefix}trigger_value_longitude`).value = newLatLng.lng.toFixed(6);
                    });
                } else {
                    // 既に地図が初期化されている場合はビューとマーカーの位置を更新
                    map.setView([lat, lng], 13);
                    marker.setLatLng([lat, lng]);
                }
            }
        }
        break;
      case "カレンダー":
        if (sub === "入力があったら") {
          triggerValueContainer.innerHTML = `
            <label>アクション (複数選択可)</label>
            <div id="${prefix}trigger_value_calendar_actions" class="co-day-of-week-selector">
              <button type="button" data-value="追加">追加</button>
              <button type="button" data-value="変更">変更</button>
              <button type="button" data-value="取得">取得</button>
              <button type="button" data-value="削除">削除</button>
            </div>
            <label>フィルター (任意)</label><br>
            <small>単語を指定して、検知するアクションにフィルターを掛けれます。</small>
            <div id="${prefix}trigger_value_calendar_filters">
              <button type="button" class="add_filter_btn co-btn ghost">フィルターを追加</button>
            </div>
            
          `;
          const actionButtonsContainer = triggerValueContainer.querySelector(`#${prefix}trigger_value_calendar_actions`);
          if (actionButtonsContainer) {
            actionButtonsContainer.addEventListener('click', (event) => {
              if (event.target.tagName === 'BUTTON') {
                event.target.classList.toggle('selected');
              }
            });
            // 復元
            if (initialValue.actions && Array.isArray(initialValue.actions)) {
              initialValue.actions.forEach(action => {
                const button = actionButtonsContainer.querySelector(`button[data-value="${action}"]`);
                if (button) {
                  button.classList.add('selected');
                }
              });
            }
          }
          const addFilterBtn = triggerValueContainer.querySelector(".add_filter_btn");
          const filterContainer = triggerValueContainer.querySelector(`#${prefix}trigger_value_calendar_filters`);
          if (addFilterBtn) {
            const addFilter = (filter = {}) => {
              const filterDiv = document.createElement("div");
              filterDiv.className = "filter-item";

              const isFirstItem = filterContainer.querySelectorAll('.filter-item').length === 0;

              let logicOptions = '';
              if (isFirstItem) {
                logicOptions = `
                  <option value="" ${filter.logic === '' ? 'selected' : ''}>(先頭)</option>
                  <option value="NOT" ${filter.logic === 'NOT' ? 'selected' : ''}>NOT (この単語が含まれていないなら)</option>
                `;
              } else {
                logicOptions = `
                  <option value="AND" ${filter.logic === 'AND' ? 'selected' : ''}>AND (「上のフィルター」と「このフィルター」の両方を満たす)</option>
                  <option value="OR" ${filter.logic === 'OR' ? 'selected' : ''}>OR (「上のフィルター」か「このフィルター」のどちらか一方でも満たす)</option>
                  <option value="NAND" ${filter.logic === 'NAND' ? 'selected' : ''}>NAND (「上のフィルター」と「このフィルター」の両方を満たすものを含まない)</option>
                  <option value="NOR" ${filter.logic === 'NOR' ? 'selected' : ''}>NOR (「上のフィルター」も「このフィルター」もどちらも満たさない)</option>
                  <option value="XOR" ${filter.logic === 'XOR' ? 'selected' : ''}>XOR (「上のフィルター」か「このフィルター」のどちらか一方だけを満たす)</option>
                  <option value="XNOR" ${filter.logic === 'XNOR' ? 'selected' : ''}>XNOR (「上のフィルター」と「このフィルター」の条件が同じである（両方満たす、または両方満たさない）)</option>
                `;
              }

function addConditionBlock(parent=document.getElementById("condition_blocks"), data={}) {
  console.log(`[DEBUG] addConditionBlock called. Parent element:`, parent);
  const block = document.createElement("div");
  const blockId = `cond_${Date.now()}_${Math.floor(Math.random() * 1e9)}`;
  block.id = blockId;
  block.className = "condition-block";
  block.innerHTML = `
    <select class="condition-logic">
      <option value="">(先頭)</option>
      <option value="NOT">NOT</option>
      <option value="AND">AND (かつ)</option>
      <option value="OR">OR (または)</option>
      <option value="NAND">NAND (両方が違うなら)</option>
      <option value="NOR">NOR (どちらかが違うなら)</option>
      <option value="XOR">XOR (どちらかが違く、かつ両方が正しくも違くもないのなら)</option>
      <option value="XNOR">XNOR (両方が正しい、または両方が違うなら)</option>
    </select>
    <select class="condition-type">
      <option value="if">if (この条件を満たしたなら)</option>
      <option value="else">else (上の条件を満たしてないのなら)</option>
    </select>
    <div class="condition-expr-container"></div>
    <button class="add-sibling-condition add-button">＋ 条件追加</button>
    <button class="add-nested-condition nest-button">＋ ネスト条件</button>
    <button class="add-nested-action nest-button">＋ ネストアクション</button>
    <button class="remove-condition remove">削除</button>
    <div class="nested-conditions"></div>
    <div class="nested-actions"></div>
  `;
  parent.appendChild(block);

  const logicSelect = block.querySelector(".condition-logic");
  const typeSelect = block.querySelector(".condition-type");
  const exprContainer = block.querySelector(".condition-expr-container");
  const isToplevel = parent.id === "condition_blocks";

  // 同階層追加ボタンの制御
  const siblingButton = block.querySelector(".add-sibling-condition");
  if (isToplevel) {
    siblingButton.style.display = "none";
  }
  siblingButton.addEventListener("click", () => {
    addConditionBlock(parent);
  });

  // ロジック選択の制御
  if (parent.children.length === 1) {
    logicSelect.querySelector('option[value="AND"]').remove();
    logicSelect.querySelector('option[value="OR"]').remove();
    logicSelect.querySelector('option[value="NAND"]').remove();
    logicSelect.querySelector('option[value="NOR"]').remove();
    logicSelect.querySelector('option[value="XOR"]').remove();
    logicSelect.querySelector('option[value="XNOR"]').remove();
    logicSelect.value = data.logic || "";
  } else {
    logicSelect.querySelector('option[value=""]').remove();
    logicSelect.querySelector('option[value="NOT"]').remove();
    logicSelect.value = data.logic || "AND";
  }

  // タイプ選択の制御
  const handleTypeChange = () => {
    const selectedType = typeSelect.value;
    exprContainer.innerHTML = ''; // コンテナをクリア

    if (selectedType === 'if') {
      const prefix = `${blockId}_`;
      exprContainer.innerHTML = `
        <label style="font-size:0.9em; opacity:0.8;">条件</label>
        <select id="${prefix}trigger_category"></select>
        <select id="${prefix}trigger_sub"></select>
        <div id="${prefix}trigger_value_container"></div>
      `;
      
      const categorySelect = document.getElementById(`${prefix}trigger_category`);
      const subSelect = document.getElementById(`${prefix}trigger_sub`);
      
      populateSelect(categorySelect.id, TRIGGER_CATEGORIES);

      const exprData = (data.expr && typeof data.expr === 'object') ? data.expr : null;

      if (exprData) {
        categorySelect.value = exprData.category || '';
      }
      
      const updateAndRestore = () => {
        updateSubOptions(`${prefix}trigger_category`, `${prefix}trigger_sub`, TRIGGER_CATEGORIES);
        if (exprData) {
          subSelect.value = exprData.sub || '';
        }
        createTriggerUI(prefix, exprData ? exprData.value : {});

        if (exprData && exprData.value) {
          setTimeout(() => {
            const value = exprData.value;
            const valueContainer = document.getElementById(`${prefix}trigger_value_container`);
            if (!valueContainer) return;

            // 各UI要素に値をセット
            for (const key in value) {
              const input = valueContainer.querySelector(`[id$="${key}"]`);
              if (input) {
                if (input.type === 'checkbox') {
                  input.checked = value[key];
                } else if (input.tagName === 'SELECT' && input.multiple) {
                  // 複数選択のselect要素の復元
                  const selectedValues = Array.isArray(value[key]) ? value[key] : [value[key]];
                  Array.from(input.options).forEach(option => {
                    option.selected = selectedValues.includes(option.value);
                  });
                } else {
                  input.value = value[key];
                }
              }
            }
            // フィルターの復元
            if (value.filters && Array.isArray(value.filters)) {
              const addFilterBtn = valueContainer.querySelector('.add_filter_btn');
              if (addFilterBtn) {
                // 既存の空フィルターを削除する場合 (createTriggerUIで生成される可能性のあるもの)
                const existingFilter = filterContainer.querySelector('.filter-item');
                if(existingFilter && !existingFilter.querySelector('input[type="text"]').value) {
                    existingFilter.remove();
                }

                value.filters.forEach(filter => {
                  addFilterBtn.click(); // フィルター追加ボタンをクリックしてUIを生成
                  const newItem = filterContainer.querySelector('.filter-item:last-child');
                  if (newItem) {
                    const textInput = newItem.querySelector('input[type="text"]');
                    const logicSelect = newItem.querySelector('select');
                    const priorityInput = newItem.querySelector('input[type="number"]');
                    if (textInput) textInput.value = filter.text || '';
                    if (logicSelect) logicSelect.value = filter.logic || 'AND';
                    if (priorityInput) priorityInput.value = filter.priority || '';
                  }
                });
              }
            }
            // アクションチェックボックスの復元 (カレンダー、収支管理、メモ)
            if (value.actions && Array.isArray(value.actions)) {
              value.actions.forEach(actionVal => {
                const checkbox = valueContainer.querySelector(`input[type="checkbox"][value="${actionVal}"]`);
                if (checkbox) {
                  checkbox.checked = true;
                }
              });
            }
          }, 100);
        }
      };
      
      categorySelect.addEventListener('change', updateAndRestore);
      subSelect.addEventListener('change', () => createTriggerUI(prefix));
      
      updateAndRestore();
    }
  };

  if (parent.children.length === 1) {
    typeSelect.querySelector('option[value="else"]').remove();
    typeSelect.value = "if";
  } else {
    typeSelect.value = data.type || "if";
  }
  
  typeSelect.addEventListener("change", handleTypeChange);
  handleTypeChange();

  block.querySelector(".remove-condition").onclick = ()=>block.remove();

  const nestedCondBtn = block.querySelector(".add-nested-condition");
  const nestedActBtn = block.querySelector(".add-nested-action");
  console.log("[DEBUG] Nested buttons found:", { nestedCondBtn, nestedActBtn });

  nestedCondBtn.onclick = () => {
    console.log("[DEBUG] Add Nested Condition button clicked.");
    addConditionBlock(block.querySelector(".nested-conditions"));
  };
  nestedActBtn.onclick = () => {
    console.log("[DEBUG] Add Nested Action button clicked.");
    addAction(block.querySelector(".nested-actions"));
  };
}

function addAction(parent, data={}) {
  console.log(`[DEBUG] addAction called. Parent element:`, parent);
  const el = document.createElement("div");
  el.className = "item";
  const prefix = `action_${Date.now()}_${Math.floor(Math.random() * 1e9)}_`;
  
  el.innerHTML = `
    <select class="action-category" id="${prefix}action_category"></select>
    <select class="action-sub" id="${prefix}action_sub"></select>
    <div class="action-timing-container" style="margin-top: 10px;">
      <label style="font-size:0.9em; opacity:0.8;">実行タイミング（無入力で即時実行）</label>
      <input type="date" class="action-timing-date-abs" id="${prefix}action_timing_date_abs" title="実行日（絶対）">
      <input type="number" class="action-timing-date-rel" id="${prefix}action_timing_date_rel" placeholder="+n 日" title="実行日（相対）" style="width: 80px;">
      <input type="time" class="action-timing-time-abs" id="${prefix}action_timing_time_abs" title="実行時刻（絶対）">
      <input type="text" class="action-timing-time-rel" id="${prefix}action_timing_time_rel" placeholder="+HH:MM:SS" title="実行時刻（相対）" style="width: 120px;">
    </div>
    <div class="action-detail-container" id="${prefix}action_detail_container" style="margin-top: 10px;">
      <!-- ここに動的UIが挿入される -->
    </div>
    <button class="remove-action">削除</button>
  `;
  parent.appendChild(el);
  el.querySelector(".remove-action").onclick=()=>el.remove();
  
  const categorySelect = el.querySelector(".action-category");
  const subSelect = el.querySelector(".action-sub");
  
  populateSelect(categorySelect.id, ACTION_CATEGORIES);

  categorySelect.addEventListener('change', () => {
    updateSubOptions(categorySelect.id, subSelect.id, ACTION_CATEGORIES);
  });
  subSelect.addEventListener('change', () => {
    createActionUI(prefix);
  });
  
  // データ復元
  if (data.category) {
    categorySelect.value = data.category;
  }
  updateSubOptions(categorySelect.id, subSelect.id, ACTION_CATEGORIES);
  if (data.sub) {
    subSelect.value = data.sub;
  }
  createActionUI(prefix, data.detail);

  setTimeout(() => {
    if (data.timing) {
      el.querySelector(".action-timing-date-abs").value = data.timing.date_abs || "";
      el.querySelector(".action-timing-date-rel").value = data.timing.date_rel || "";
      el.querySelector(".action-timing-time-abs").value = data.timing.time_abs || "";
      el.querySelector(".action-timing-time-rel").value = data.timing.time_rel || "";
    }
  }, 100);
}

function parseConditions(root){
  return [...root.children].map(block => {
    const type = block.querySelector(".condition-type").value;
    let expr = null;

    if (type === 'if') {
      const container = block.querySelector('.condition-expr-container');
      const prefix = block.id + '_';
      
      const categorySelect = document.getElementById(`${prefix}trigger_category`);
      const subSelect = document.getElementById(`${prefix}trigger_sub`);
      
      if (categorySelect) {
        const category = categorySelect.value;
        const sub = subSelect.value;
        const valueContainer = document.getElementById(`${prefix}trigger_value_container`);
        let value = {};

        if (valueContainer) {
            const category = categorySelect.value;
            const sub = subSelect.value;

            switch (category) {
              case "場所":
                value.address = valueContainer.querySelector(`[id$="trigger_value_address"]`)?.value;
                value.latitude = valueContainer.querySelector(`[id$="trigger_value_latitude"]`)?.value;
                value.longitude = valueContainer.querySelector(`[id$="trigger_value_longitude"]`)?.value;
                value.range = valueContainer.querySelector(`[id$="trigger_value_range"]`)?.value;
                break;
              case "カレンダー":
                if (sub === "入力があったら") {
                  value.actions = [...valueContainer.querySelectorAll(`#${prefix}trigger_value_calendar_actions button.selected`)].map(btn => btn.dataset.value);
                  value.filters = [...valueContainer.querySelectorAll(".filter-item")].map(item => ({
                    text: item.querySelector(".calendar_filter_text")?.value,
                    logic: item.querySelector(".calendar_filter_logic")?.value
                  }));
                } else if (sub === "予定の時間になったら") {
                  value.title = valueContainer.querySelector(`[id$="trigger_value_cal_title"]`)?.value;
                  value.start_year = valueContainer.querySelector(`[id$="trigger_value_cal_start_year"]`)?.value;
                  value.start_month = valueContainer.querySelector(`[id$="trigger_value_cal_start_month"]`)?.value;
                  value.start_day = valueContainer.querySelector(`[id$="trigger_value_cal_start_day"]`)?.value;
                  value.day_of_week = [...valueContainer.querySelectorAll(`[id$="trigger_value_cal_day_of_week_buttons"] button.selected`)].map(btn => btn.dataset.value);
                  value.start_time = valueContainer.querySelector(`[id$="trigger_value_cal_start_time"]`)?.value;
                  value.end_year = valueContainer.querySelector(`[id$="trigger_value_cal_end_year"]`)?.value;
                  value.end_month = valueContainer.querySelector(`[id$="trigger_value_cal_end_month"]`)?.value;
                  value.end_day = valueContainer.querySelector(`[id$="trigger_value_cal_end_day"]`)?.value;
                  value.end_time = valueContainer.querySelector(`[id$="trigger_value_cal_end_time"]`)?.value;
                }
                break;
              case "収支管理":
                if (sub === "入力があったら") {
                  value.actions = [...valueContainer.querySelectorAll(`#${prefix}trigger_value_finance_actions button.selected`)].map(btn => btn.dataset.value);
                  if (value.actions.includes('追加')) {
                    value.genres = [...valueContainer.querySelectorAll(`#${prefix}trigger_value_finance_genres button.selected`)].map(btn => btn.dataset.value);
                  }
                } else if (sub === "特定金額になったら") {
                  value.item = valueContainer.querySelector(`[id$="trigger_value_finance_item"]`)?.value;
                  value.amount = valueContainer.querySelector(`[id$="trigger_value_finance_amount"]`)?.value;
                  value.percentage = valueContainer.querySelector(`[id$="trigger_value_finance_percentage"]`)?.value;
                }
                break;
              case "メモ":
                value.actions = [...valueContainer.querySelectorAll(`#${prefix}trigger_value_memo_actions button.selected`)].map(btn => btn.dataset.value);
                value.filters = [...valueContainer.querySelectorAll(".filter-item")].map(item => ({
                  text: item.querySelector(".memo_filter_text")?.value,
                  logic: item.querySelector(".memo_filter_logic")?.value
                }));
                break;
              case "時間":
                // `prefix` がある場合は条件設定なので、範囲指定UIから値を取得
                value.start_year = valueContainer.querySelector(`[id$='_time_start_year']`)?.value;
                value.start_month = valueContainer.querySelector(`[id$='_time_start_month']`)?.value;
                value.start_day = valueContainer.querySelector(`[id$='_time_start_day']`)?.value;
                value.day_of_week = [...valueContainer.querySelectorAll(`[id$='_time_day_of_week_buttons'] button.selected`)].map(btn => btn.dataset.value);
                value.start_time = valueContainer.querySelector(`[id$='_time_start_time']`)?.value;
                value.end_year = valueContainer.querySelector(`[id$='_time_end_year']`)?.value;
                value.end_month = valueContainer.querySelector(`[id$='_time_end_month']`)?.value;
                value.end_day = valueContainer.querySelector(`[id$='_time_end_day']`)?.value;
                value.end_time = valueContainer.querySelector(`[id$='_time_end_time']`)?.value;
                break;
              default:
                value.value = valueContainer.querySelector(`[id$="trigger_value"]`)?.value;
                break;
            }
        }

        expr = {
          category: category,
          sub: sub,
          value: value
        };
      }
    }

    return {
      logic: block.querySelector(".condition-logic").value,
      type: type,
      expr: expr,
      nested: parseConditions(block.querySelector(".nested-conditions")),
      actions: [...block.querySelectorAll(".nested-actions > .item")].map(actionItem => {
        const prefix = actionItem.querySelector('.action-category').id.replace('action_category', '');
        const category = actionItem.querySelector(".action-category").value;
        const sub = actionItem.querySelector(".action-sub").value;
        const timing = {
          date_abs: actionItem.querySelector(".action-timing-date-abs").value,
          date_rel: actionItem.querySelector(".action-timing-date-rel").value,
          time_abs: actionItem.querySelector(".action-timing-time-abs").value,
          time_rel: actionItem.querySelector(".action-timing-time-rel").value,
        };
        let detail = {};
        const detailContainer = actionItem.querySelector(".action-detail-container");
        
        switch (category) {
          case "カレンダー":
            if (sub === "追加" || sub === "削除") {
              detail.text = detailContainer.querySelector(".action-detail-cal-text")?.value;
            } else if (sub === "読み上げ") {
              detail.start_abs = detailContainer.querySelector(".action-detail-cal-read-start-abs")?.value;
              detail.start_rel = detailContainer.querySelector(".action-detail-cal-read-start-rel")?.value;
              detail.end_abs = detailContainer.querySelector(".action-detail-cal-read-end-abs")?.value;
              detail.end_rel = detailContainer.querySelector(".action-detail-cal-read-end-rel")?.value;
            }
            break;
          case "収支管理":
            if (sub === "読み上げ") {
              detail.item = detailContainer.querySelector(".action-detail-fin-read-item")?.value;
              detail.format = detailContainer.querySelector(".action-detail-fin-read-format")?.value;
              detail.start_abs = detailContainer.querySelector(".action-detail-fin-read-start-abs")?.value;
              detail.start_rel = detailContainer.querySelector(".action-detail-fin-read-start-rel")?.value;
              detail.end_abs = detailContainer.querySelector(".action-detail-fin-read-end-abs")?.value;
              detail.end_rel = detailContainer.querySelector(".action-detail-fin-read-end-rel")?.value;
            }
            break;
          case "メモ":
            if (sub === "読み上げ") {
              detail.start_abs = detailContainer.querySelector(".action-detail-memo-read-start-abs")?.value;
              detail.start_rel = detailContainer.querySelector(".action-detail-memo-read-start-rel")?.value;
              detail.end_abs = detailContainer.querySelector(".action-detail-memo-read-end-abs")?.value;
              detail.end_rel = detailContainer.querySelector(".action-detail-memo-read-end-rel")?.value;
            }
            break;
          case "メール":
            if (sub === "送信") {
              detail.subject = detailContainer.querySelector(".action-detail-mail-subject")?.value;
              detail.body = detailContainer.querySelector(".action-detail-mail-body")?.value;
            }
            break;
        }

        return { category, sub, timing, detail };
      })
    };
  });
}

function loadCommandToForm(cmd){
  console.log("--- [DEBUG] loadCommandToForm called with cmd:", cmd); // デバッグログ追加
  // フォームをリセット
  document.getElementById("name").value = "";
  document.getElementById("trigger_category").value = "";
  document.getElementById("trigger_sub").innerHTML = "<option value=''>選択してください</option>";
  document.getElementById("trigger_value_container").innerHTML = '<input type="text" id="trigger_value" placeholder="値">';
  document.getElementById("condition_blocks").innerHTML = "";
  document.getElementById("action_category").value = "";
  document.getElementById("action_sub").innerHTML = "<option value=''>選択してください</option>";
  document.getElementById("action_detail_container").innerHTML = "";
  document.getElementById("command-id")?.remove();


  // データをフォームに設定
  document.getElementById("name").value = cmd.name;
  
  // Triggerの復元
  if (cmd.triggers && cmd.triggers.length > 0) {
    const trigger = cmd.triggers[0];
    console.log("--- [DEBUG] Restoring trigger:", trigger); // デバッグログ追加
    const triggerCategorySelect = document.getElementById("trigger_category");
    const triggerSubSelect = document.getElementById("trigger_sub");

    triggerCategorySelect.value = trigger.category || "";
    updateSubOptions(triggerCategorySelect.id, triggerSubSelect.id, TRIGGER_CATEGORIES);
    triggerSubSelect.value = trigger.sub || "";
    // createTriggerUI(''); // ここでUIを再生成すると、setTimeoutの前にinnerHTMLがクリアされる可能性がある

    // 動的に生成されたトリガー詳細UIに値を設定
    // createTriggerUIにtrigger.valueを渡してUI生成と値の設定を一度に行う
    createTriggerUI('', trigger.value);
  }

  document.getElementById("condition_blocks").innerHTML="";
  (cmd.conditions||[]).forEach(c=>addConditionBlockFromData(c, document.getElementById("condition_blocks")));

  if(cmd.actions?.length > 0){
    const a = cmd.actions[0];
    const categorySelect = document.getElementById("action_category");
    const subSelect = document.getElementById("action_sub");

    categorySelect.value = a.category || "";
    updateSubOptions(categorySelect.id, subSelect.id, ACTION_CATEGORIES);
    subSelect.value = a.sub || "";
    createActionUI('');

    setTimeout(() => {
      if (a.timing) {
        document.getElementById("action_timing_date_abs").value = a.timing.date_abs || "";
        document.getElementById("action_timing_date_rel").value = a.timing.date_rel || "";
        document.getElementById("action_timing_time_abs").value = a.timing.time_abs || "";
        document.getElementById("action_timing_time_rel").value = a.timing.time_rel || "";
      }
      if (a.detail) {
        const detailContainer = document.getElementById("action_detail_container");
        for(const key in a.detail) {
          const input = detailContainer.querySelector(`[class*="${key}"]`);
          if(input) {
            if (input.type === 'checkbox') {
              input.checked = a.detail[key];
            } else if (input.tagName === 'SELECT' && input.multiple) {
              const selectedValues = Array.isArray(a.detail[key]) ? a.detail[key] : [a.detail[key]];
              Array.from(input.options).forEach(option => {
                option.selected = selectedValues.includes(option.value);
              });
            } else {
              input.value = a.detail[key];
            }
          }
        }
      }
    }, 100);
  }

  document.getElementById("command-id")?.remove();
  const hid=document.createElement("input"); hid.type="hidden"; hid.id="command-id"; hid.value=cmd.id;
  document.getElementById("register-btn").parentNode.appendChild(hid);
}

function addConditionBlockFromData(data,parent){
  addConditionBlock(parent, data);
  const b=parent.lastElementChild;
  if(data.nested?.length) data.nested.forEach(n=>addConditionBlockFromData(n,b.querySelector(".nested-conditions")));
  if(data.actions?.length) data.actions.forEach(a=>addAction(b.querySelector(".nested-actions"),a));
}

async function registerCommand(){
  console.log("--- [DEBUG] registerCommand called ---");
  const id=document.getElementById("command-id")?.value||null;
  
  // バリデーション: 命令名が空の場合はアラートを出して処理を中断
  const commandName = document.getElementById("name").value;
  if (!commandName || !commandName.trim()) {
    alert("命令名を入力してください。");
    return;
  }

  // Trigger
  const triggerCategory = document.getElementById("trigger_category").value;
  const triggerSub = document.getElementById("trigger_sub").value;
  let triggerValue = {};
  const triggerContainer = document.getElementById("trigger_value_container");

  // Triggerのデータ収集ロジック

    case "場所":
      triggerValue.address = triggerContainer.querySelector("#trigger_value_address")?.value;
      triggerValue.latitude = triggerContainer.querySelector("#trigger_value_latitude")?.value;
      triggerValue.longitude = triggerContainer.querySelector("#trigger_value_longitude")?.value;
      triggerValue.range = triggerContainer.querySelector("#trigger_value_range")?.value;
      break;
    case "カレンダー":
      if (triggerSub === "入力があったら") {
        triggerValue.actions = [...triggerContainer.querySelectorAll("#trigger_value_calendar_actions button.selected")].map(btn => btn.dataset.value);
        triggerValue.filters = [...triggerContainer.querySelectorAll(".filter-item")].map(item => ({
          text: item.querySelector(".calendar_filter_text")?.value,
          logic: item.querySelector(".calendar_filter_logic")?.value
        }));
      } else if (triggerSub === "予定の時間になったら") {
        triggerValue.title = triggerContainer.querySelector("#trigger_value_cal_title")?.value;
        triggerValue.date_start = triggerContainer.querySelector("#trigger_value_cal_date_start")?.value;
        triggerValue.date_end = triggerContainer.querySelector("#trigger_value_cal_date_end")?.value;
        triggerValue.day_of_week = [...triggerContainer.querySelector("#trigger_value_cal_day_of_week")?.selectedOptions].map(option => option.value);
        triggerValue.time_start = triggerContainer.querySelector("#trigger_value_cal_time_start")?.value;
        triggerValue.time_end = triggerContainer.querySelector("#trigger_value_cal_time_end")?.value;
      }
      break;
    case "収支管理":
      if (triggerSub === "入力があったら") {
        triggerValue.actions = [...triggerContainer.querySelectorAll("input[id^='finance_action_']:checked")].map(cb => cb.value);
        triggerValue.filters = [...triggerContainer.querySelectorAll(".filter-item")].map(item => ({
          text: item.querySelector(".finance_filter_text")?.value,
          logic: item.querySelector(".finance_filter_logic")?.value,
          priority: item.querySelector(".finance_filter_priority")?.value
        }));
      } else if (triggerSub === "特定金額になったら") {
        triggerValue.item = triggerContainer.querySelector("#trigger_value_finance_item")?.value;
        triggerValue.amount = triggerContainer.querySelector("#trigger_value_finance_amount")?.value;
        triggerValue.percentage = triggerContainer.querySelector("#trigger_value_finance_percentage")?.value;
      }
      break;
    case "メモ":
      if (triggerSub === "入力があったら") {
        triggerValue.actions = [...triggerContainer.querySelectorAll("input[id^='memo_action_']:checked")].map(cb => cb.value);
        triggerValue.filters = [...triggerContainer.querySelectorAll(".filter-item")].map(item => ({
          text: item.querySelector(".memo_filter_text")?.value,
          logic: item.querySelector(".memo_filter_logic")?.value,
          priority: item.querySelector(".memo_filter_priority")?.value
        }));
      } else if (triggerSub === "特定のメモが追加されたら") {
        triggerValue.filters = [...triggerContainer.querySelectorAll(".filter-item")].map(item => ({
          text: item.querySelector(".memo_filter_text")?.value,
          logic: item.querySelector(".memo_filter_logic")?.value,
          priority: item.querySelector(".memo_filter_priority")?.value
        }));
      }
      break;
                                  case "時間":
                                    triggerValue.year = triggerContainer.querySelector("#trigger_value_time_year")?.value;
                                    triggerValue.month = triggerContainer.querySelector("#trigger_value_time_month")?.value;
                                    triggerValue.day = triggerContainer.querySelector("#trigger_value_time_day")?.value;
                                    triggerValue.day_of_week = [...triggerContainer.querySelectorAll("#trigger_value_time_day_of_week_buttons button.selected")].map(btn => btn.dataset.value);
                                    triggerValue.time_start = triggerContainer.querySelector("#trigger_value_time_start")?.value;
                                    triggerValue.time_end = triggerContainer.querySelector("#trigger_value_time_time_end")?.value;
                                    break;    default:
      triggerValue.value = triggerContainer.querySelector("#trigger_value")?.value;
      break;
  }

  // Action
  const actionCategory = document.getElementById("action_category").value;
  const actionSub = document.getElementById("action_sub").value;
  const actionTiming = {
    date_abs: document.getElementById("action_timing_date_abs")?.value,
    date_rel: document.getElementById("action_timing_date_rel")?.value,
    time_abs: document.getElementById("action_timing_time_abs")?.value,
    time_rel: document.getElementById("action_timing_time_rel")?.value,
  };
  let actionDetail = {};
  const detailContainer = document.getElementById("action_detail_container");

  // Actionのデータ収集ロジック
  switch (actionCategory) {
    case "カレンダー":
      if (actionSub === "追加" || actionSub === "削除") {
        actionDetail.text = detailContainer.querySelector(".action-detail-cal-text")?.value;
      } else if (actionSub === "読み上げ") {
        actionDetail.start_abs = detailContainer.querySelector(".action-detail-cal-read-start-abs")?.value;
        actionDetail.start_rel = detailContainer.querySelector(".action-detail-cal-read-start-rel")?.value;
        actionDetail.end_abs = detailContainer.querySelector(".action-detail-cal-read-end-abs")?.value;
        actionDetail.end_rel = detailContainer.querySelector(".action-detail-cal-read-end-rel")?.value;
      }
      break;
    case "収支管理":
      if (actionSub === "読み上げ") {
        actionDetail.item = detailContainer.querySelector(".action-detail-fin-read-item")?.value;
        actionDetail.format = detailContainer.querySelector(".action-detail-fin-read-format")?.value;
        actionDetail.start_abs = detailContainer.querySelector(".action-detail-fin-read-start-abs")?.value;
        actionDetail.start_rel = detailContainer.querySelector(".action-detail-fin-read-start-rel")?.value;
        actionDetail.end_abs = detailContainer.querySelector(".action-detail-fin-read-end-abs")?.value;

      if (actionSub === "読み上げ") {
        actionDetail.start_abs = detailContainer.querySelector(".action-detail-memo-read-start-abs")?.value;
        actionDetail.start_rel = detailContainer.querySelector(".action-detail-memo-read-start-rel")?.value;
        actionDetail.end_abs = detailContainer.querySelector(".action-detail-memo-read-end-abs")?.value;
        actionDetail.end_rel = detailContainer.querySelector(".action-detail-memo-read-end-rel")?.value;
      }
      break;
    case "メール":
      if (actionSub === "送信") {
        actionDetail.subject = detailContainer.querySelector(".action-detail-mail-subject")?.value;
        actionDetail.body = detailContainer.querySelector(".action-detail-mail-body")?.value;
        // TODO: 付与情報 (attachment) の収集ロジック
      }
      break;
  }

  const payload={
    name:document.getElementById("name").value,
    triggers:[{
      category: triggerCategory,
      sub: triggerSub,
      value: triggerValue
    }],
    conditions:parseConditions(document.getElementById("condition_blocks")),
    actions:[{
      category: actionCategory,
      sub: actionSub,
      timing: actionTiming,
      detail: actionDetail
    }]
  };
  console.log("--- [DEBUG] Payload to be sent:", JSON.stringify(payload, null, 2));

  try {
    const res = await fetch(id ? `/api/custom_orders/${id}` : "/api/custom_orders", {
      method: id ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    console.log("--- [DEBUG] Fetch response status:", res.status);
    const data = await res.json();
    console.log("--- [DEBUG] Fetch response data:", data);

    document.getElementById("message").innerText = data.message || "保存しました";
    setTimeout(() => document.getElementById("message").innerText = "", 3000);
    document.getElementById("command-id")?.remove();
    loadCommands();
  } catch (error) {
    console.error("--- [ERROR] Fetch failed:", error);
    document.getElementById("message").innerText = "エラーが発生しました。コンソールを確認してください。";
  }
}

async function fetchGenres() {
  try {
    const response = await fetch('/api/categories');
    if (!response.ok) {
      console.error('Failed to fetch genres:', response.statusText);
      return [];
    }
    const genres = await response.json();
    return genres;
  } catch (error) {
    console.error('Error fetching genres:', error);
    return [];
  }
}

async function loadCommands() {
  console.log("--- [DEBUG] loadCommands called ---");
  try {
    const res = await fetch("/api/custom_orders");
    console.log("--- [DEBUG] loadCommands fetch response status:", res.status);
    if (!res.ok) {
      console.error("--- [ERROR] Fetch failed with status:", res.status);
      const errorText = await res.text();
      console.error("--- [ERROR] Fetch error response text:", errorText);
      document.getElementById("command-list").innerHTML = `<p style="color:red;">一覧の読み込みに失敗しました。</p>`;
      return;
    }
    const list = await res.json();
    console.log("--- [DEBUG] loadCommands received list:", list);

    const container = document.getElementById("command-list");
    container.innerHTML = "";
    if (!list || !list.length) {
      container.innerHTML = "<p>登録された命令はありません。</p>";
      return;
    }
    list.forEach(cmd => {
      const div = document.createElement("div");
      div.className = "item";
      // nameプロパティが存在しない場合も考慮
      div.innerHTML = `<b>${cmd.name || '名前なし'}</b> (ID:${cmd.id})`;
      const editBtn = document.createElement("button");
      editBtn.className = "nest-button";
      editBtn.innerText = "編集";
      editBtn.onclick = () => loadCommandToForm(cmd);
      const delBtn = document.createElement("button");
      delBtn.className = "remove";
      delBtn.innerText = "削除";
      delBtn.onclick = async () => {
        if (confirm("削除しますか？")) {
          await fetch(`/api/custom_orders/${cmd.id}`, {
            method: "DELETE"
          });
          loadCommands();
        }
      };
      div.appendChild(editBtn);
      div.appendChild(delBtn);
      container.appendChild(div);
    });
  } catch (error) {
    console.error("--- [ERROR] loadCommands failed:", error);
    document.getElementById("command-list").innerHTML = `<p style="color:red;">一覧の読み込み中にエラーが発生しました。</p>`;
  }
}

async function geocodeAddress(address) {
  console.log("[DEBUG] geocodeAddress started. Address:", address);
  const GeospatialUrl = "https://msearch.gsi.go.jp/address-search/AddressSearch?q=";
  const requestUrl = GeospatialUrl + encodeURIComponent(address) + "&json=true";
  console.log("[DEBUG] Fetching URL:", requestUrl);

  try {
    const response = await fetch(requestUrl);
    console.log("[DEBUG] Received response. Status:", response.status, "Ok:", response.ok);

    if (!response.ok) { // APIからのHTTPエラーレスポンス（504など）
      const errorText = await response.text(); // エラーレスポンスのテキストも取得
      console.error(`[DEBUG] API returned non-OK status: ${response.status}. Response text:`, errorText);
      return { type: "api_error", status: response.status, errorText: errorText };
    }

    const responseText = await response.text();
    console.log("[DEBUG] Raw response text:", responseText);

    // JSONパースを試みる
    let data;
    try {
      data = JSON.parse(responseText);
      console.log("[DEBUG] Parsed JSON data:", data);
    } catch (jsonError) {
      console.error("[DEBUG] JSON parsing failed, but API status was OK. Response text might not be JSON:", jsonError);
      return { type: "malformed_response", error: jsonError, responseText: responseText };
    }

    if (data && data.length > 0 && data[0].geometry && data[0].geometry.coordinates) {
      const lng = data[0].geometry.coordinates[0];
      const lat = data[0].geometry.coordinates[1];
      console.log("[DEBUG] Geocoding successful. Lat:", lat, "Lng:", lng);
      return { type: "success", lat: lat, lng: lng, display_name: address };
    } else {
      console.log("[DEBUG] Geocoding failed. No coordinates found in response.");
      return { type: "no_coordinates" };
    }
  } catch (error) { // ネットワークエラーなど
    console.error("[DEBUG] An error occurred during fetch or processing:", error);
    return { type: "network_error", error: error };
  }
}
