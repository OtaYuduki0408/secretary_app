<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カスタム命令 | Secretary Automation</title>
  <link rel="stylesheet" href="/custom_order/static/css/index.css">
  <script async defer src="https://maps.googleapis.com/maps/api/js?key={{ gcp_api_key }}"></script>
</head>
<body class="co-body">
  <div class="co-shell">
    <header class="co-header">
      <a href="{{ url_for('main', internal_nav=true) }}" class="co-link-btn">← メインに戻る</a>
      <div class="co-header-copy">
        <p class="co-eyebrow">Automation Studio</p>
        <h1>カスタム命令</h1>
        <p class="co-subtitle">収支やカレンダーイベントをトリガーに、日々のルーティンを自動化しましょう。</p>
      </div>
    </header>

    <main class="co-layout">
      <section class="co-card co-form-card">
        <div class="co-section-head">
          <div>
            <p class="co-eyebrow">Flow Builder</p>
            <h2 class="co-section-title">命令の設定</h2>
          </div>
          <p class="co-section-desc">条件とアクションを組み合わせて理想のワークフローを構築します。</p>
        </div>

        <div class="co-fieldset">
          <label for="name">命令名</label>
          <input type="text" id="name" class="co-input" placeholder="例：朝の通知">
        </div>

        <div class="co-fieldset">
          <div class="co-fieldset-head">
            <h3>トリガー設定</h3>
            <p>カレンダーや収支状況など開始条件を選択します</p>
          </div>
          <div class="co-grid-two">
            <div class="co-field">
              <label for="trigger_category">カテゴリ</label>
              <select id="trigger_category" class="co-select"></select>
            </div>
            <div class="co-field">
              <label for="trigger_sub">詳細</label>
              <select id="trigger_sub" class="co-select"></select>
            </div>
          </div>
          <div id="trigger_value_container" class="co-dynamic-field">
            <input type="text" id="trigger_value" class="co-input" placeholder="値を入力（例：◯◯に到着）">
          </div>
        </div>

        <div class="co-fieldset">
          <div class="co-fieldset-head">
            <h3>アクション・追加条件設定</h3>
            <p>実行するアクションや、アクションの実行条件を設定します</p>
          </div>
          <div class="co-add-buttons-top" style="margin-bottom: 16px; display: flex; gap: 8px;">
            <button class="co-btn ghost add-button" id="add-action-top" type="button">＋ アクションを追加</button>
            <button class="co-btn ghost add-button" id="add-condition-top" type="button">＋ 条件を追加</button>
          </div>
          <div id="condition_blocks" class="co-stack"></div>
        </div>

        <div class="co-actions">
          <button class="co-btn primary save-button" id="register-btn" type="button">💾 保存する</button>
          <p id="message" class="co-inline-message" role="status"></p>
        </div>
      </section>

      <section class="co-card co-list-card">
        <div class="co-section-head">
          <div>
            <p class="co-eyebrow">Library</p>
            <h2 class="co-section-title">既存命令一覧</h2>
          </div>
          <p class="co-section-desc">登録済みのフローをリアルタイムで編集・削除できます。</p>
        </div>
        <div id="command-list" class="co-command-list"></div>
      </section>
    </main>
  </div>
<script>
  window.gcp_api_key = "{{ gcp_api_key }}";
</script>
<script src="{{ url_for('static', filename='js/app_settings_apply.js') }}"></script>
<script type="module" src="{{ url_for('custom_order_pages.static', filename='js/trigger_ui.js', _t=config['VERSION_TIMESTAMP']) }}"></script>
<script type="module" src="{{ url_for('custom_order_pages.static', filename='js/index.js', _t=config['VERSION_TIMESTAMP']) }}"></script>
</body>
</html>
