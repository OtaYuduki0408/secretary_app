<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モバイルカレンダー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dev_mobile.css') }}">
</head>
<body class="mobile-page">
  <main class="mobile-calendar-shell">
    <header class="mobile-header">
      <h1>カレンダー</h1>
      <a href="/dev/mobile/direct/voice" class="link-btn">音声入力へ</a>
    </header>
    <section class="card">
      <div id="calendar"></div>
    </section>
  </main>

  <div id="event-modal" class="modal-overlay">
    <div class="modal-content card">
      <h2 id="modal-title">イベント</h2>
      <label class="field"><span class="label">タイトル</span><input id="event-title" class="input" placeholder="予定名"></label>
      <label class="field"><span class="label">説明</span><input id="event-desc" class="input" placeholder="任意"></label>
      <label class="field"><span class="label">開始</span><input id="event-start" class="input" type="datetime-local"></label>
      <label class="field"><span class="label">終了</span><input id="event-end" class="input" type="datetime-local"></label>
      <div class="card-actions">
        <button id="cancel-event-button" class="btn ghost">キャンセル</button>
        <button id="delete-event-button" class="btn danger" style="display:none;">削除</button>
        <button id="save-event-button" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.13/index.global.min.js"></script>
  <script>
    window.__DEV_MOBILE_CREDENTIALS__ = {{ forced_credentials | tojson }};
    const toApiDate = (value) => value ? value.replace('T', ' ') + ':00' : '';
    const formatLocal = (value) => {
      if (!value) return '';
      const d = new Date(value);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const ensureLogin = async () => {
      const res = await fetch('/dev/mobile/bootstrap_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(window.__DEV_MOBILE_CREDENTIALS__ || {}),
      });
      if (!res.ok) throw new Error('login failed');
    };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await ensureLogin();
      } catch (e) {
        alert('開発者ログインに失敗しました。');
        return;
      }

      const modal = document.getElementById('event-modal');
      const titleInput = document.getElementById('event-title');
      const descInput = document.getElementById('event-desc');
      const startInput = document.getElementById('event-start');
      const endInput = document.getElementById('event-end');
      const saveBtn = document.getElementById('save-event-button');
      const deleteBtn = document.getElementById('delete-event-button');
      const cancelBtn = document.getElementById('cancel-event-button');
      let editingId = null;

      const openModal = (eventObj, dateStr) => {
        modal.classList.add('is-visible');
        if (eventObj) {
          editingId = eventObj.id;
          titleInput.value = eventObj.title || '';
          descInput.value = eventObj.extendedProps.description || '';
          startInput.value = formatLocal(eventObj.start);
          endInput.value = formatLocal(eventObj.end);
          deleteBtn.style.display = 'inline-block';
          saveBtn.textContent = '更新';
        } else {
          editingId = null;
          titleInput.value = '';
          descInput.value = '';
          startInput.value = dateStr ? `${dateStr}T09:00` : '';
          endInput.value = dateStr ? `${dateStr}T10:00` : '';
          deleteBtn.style.display = 'none';
          saveBtn.textContent = '保存';
        }
      };

      const closeModal = () => modal.classList.remove('is-visible');
      cancelBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

      const api = {
        async addEvent(payload) {
          const res = await fetch('/api/local_calendar/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error('add failed');
          return res.json();
        },
        async updateEvent(id, payload) {
          const res = await fetch(`/api/local_calendar/events/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error('update failed');
          return res.json();
        },
        async deleteEvent(id) {
          const res = await fetch(`/api/local_calendar/events/${id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('delete failed');
        },
      };

      const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        locale: 'ja',
        initialView: 'dayGridMonth',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
        eventSources: [{
          url: '/api/local_calendar/events',
          eventDataTransform: (data) => ({
            id: data.id,
            title: data.title,
            start: data.start_time,
            end: data.end_time,
            description: data.description,
          }),
        }],
        dateClick: (info) => openModal(null, info.dateStr),
        eventClick: (info) => openModal(info.event, null),
      });
      calendar.render();

      saveBtn.addEventListener('click', async () => {
        const payload = {
          title: titleInput.value.trim(),
          description: descInput.value.trim(),
          start_time: toApiDate(startInput.value),
          end_time: toApiDate(endInput.value),
        };
        if (!payload.title || !payload.start_time || !payload.end_time) {
          alert('必須項目を入力してください。');
          return;
        }
        try {
          if (editingId) {
            await api.updateEvent(editingId, payload);
          } else {
            await api.addEvent(payload);
          }
          closeModal();
          calendar.refetchEvents();
        } catch (e) {
          alert('保存に失敗しました。');
        }
      });

      deleteBtn.addEventListener('click', async () => {
        if (!editingId) return;
        try {
          await api.deleteEvent(editingId);
          closeModal();
          calendar.refetchEvents();
        } catch (e) {
          alert('削除に失敗しました。');
        }
      });
    });
  </script>
</body>
</html>
