<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>種類の情報変更</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/finance.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>種類の情報変更</h1>
            <a href="{{ url_for('expense') }}">収支管理へ戻る</a>
        </div>

        <section class="card">
            <h2>種類の追加</h2>
            <div class="actions">
                <input id="cat-input" class="input" placeholder="例：食事 / 必需品 / 収入 など" />
                <select id="cat-type" class="input" style="width: 100px; margin-right: 8px;">
                    <option value="expense">支出</option>
                    <option value="income">収入</option>
                </select>
                <button id="cat-add" class="btn" type="button">追加</button>
                <button id="cat-clear" class="btn" type="button" style="background:#ef4444">全削除</button>
            </div>
            <p style="color:#6b7280;margin-top:6px">
                ※ 同名・同タイプは追加されません。削除は各ボックスの「×」を押してください。
            </p>
        </section>

        <section class="card">
            <h2>現在の種類</h2>

            <!-- ここを修正 -->
            <div id="cat-data" data-categories='{{ categories | default([]) | tojson }}'></div>

            <div id="cat-list" class="chips"></div>
            <div id="cat-empty" class="empty" style="display:none">
                種類がまだありません。上の入力から追加してください。
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/categories.js') }}"></script>
</body>
</html>
