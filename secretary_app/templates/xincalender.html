<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>カレンダー — 管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif; padding:18px; background:#f6fbff; color:#0f172a }
    .panel { background:white; padding:16px; border-radius:8px; box-shadow:0 6px 20px rgba(10,20,40,.06); max-width:980px; margin:12px auto; }
    .row { display:flex; gap:12px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    input, button { padding:8px 10px; border-radius:8px; border:1px solid #d7e6ff; }
    button { cursor:pointer; background:#2b6cb0; color:white; border:none; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th,td { padding:8px; text-align:left; border-bottom:1px solid #eef5ff; }
    .muted { color:#64748b; font-size:.95rem; }
    .danger { background:#ef4444; color:white; border:none; padding:6px 8px; border-radius:6px; }
    .small { font-size:.9rem; padding:6px 8px; }
    .inline { display:inline-flex; gap:8px; align-items:center; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Google カレンダー 管理</h1>
    <p class="muted">サーバ側の OAuth（/google-login → /oauth-callback）を使います。最初にログインしてください。</p>

    <div class="row">
      <button id="btn-login">Google ログイン（サーバ側）</button>
      <button id="btn-refresh" class="small">予定を再読み込み</button>
      <span id="auth-status" class="muted">認証状態: <strong id="auth-flag">不明</strong></span>
    </div>

    <section style="margin-top:12px;">
      <h2>予定を追加</h2>
      <form id="add-form" onsubmit="return false;" class="row">
        <input id="title" placeholder="タイトル" required />
        <input id="start" type="datetime-local" required />
        <input id="end" type="datetime-local" />
        <input id="desc" placeholder="説明（任意）" />
        <div class="inline">
          <button id="btn-add">追加</button>
          <button id="btn-clear" type="button" class="small">入力クリア</button>
        </div>
      </form>
    </section>

    <section id="events-section" style="margin-top:18px;">
      <h2>今後の予定（7日間）</h2>
      <div id="events-loading" class="muted">読み込み中...</div>
      <table id="events-table" hidden>
        <thead>
          <tr><th>タイトル</th><th>開始</th><th>終了</th><th>説明</th><th>操作</th></tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>
      <div id="no-events" class="muted" hidden>予定は見つかりませんでした。</div>
    </section>
  </main>

<script>
  // --- 補助関数 ---
  function fmtLocal(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleString();
    } catch (e) { return iso; }
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, opts);
    if (!res.ok) {
      const txt = await res.text().catch(()=>null);
      throw new Error('HTTP ' + res.status + ' ' + (txt || res.statusText));
    }
    return res.json();
  }

  // --- UI 要素 ---
  const authFlag = document.getElementById('auth-flag');
  const btnLogin = document.getElementById('btn-login');
  const btnRefresh = document.getElementById('btn-refresh');

  const eventsTable = document.getElementById('events-table');
  const eventsBody = document.getElementById('events-body');
  const eventsLoading = document.getElementById('events-loading');
  const noEvents = document.getElementById('no-events');

  // 新規追加フォーム
  const addForm = document.getElementById('add-form');
  const titleInput = document.getElementById('title');
  const startInput = document.getElementById('start');
  const endInput = document.getElementById('end');
  const descInput = document.getElementById('desc');
  const btnAdd = document.getElementById('btn-add');
  const btnClear = document.getElementById('btn-clear');

  // --- 操作 ---
  btnLogin.addEventListener('click', () => {
    // 使用しているサーバ側 OAuth 開始点
    // ここは既存の /google-login に合わせています（app.py に定義済み）
    const w = window.open('/google-login', 'google_oauth', 'width=900,height=700');
    // popup が閉じられたら再確認
    const checker = setInterval(async () => {
      if (w && w.closed) {
        clearInterval(checker);
        await checkAuth();
        await loadEvents();
      }
    }, 800);
  });

  async function checkAuth() {
    try {
      // 这里假设后端提供一个简易接口 /api/calendar/auth 来告诉前端是否有 token/有效凭据
      const j = await api('/api/calendar/auth');
      authFlag.textContent = j.authenticated ? 'ログイン済み' : '未ログイン';
      return j.authenticated;
    } catch (e) {
      console.warn('auth check failed', e);
      authFlag.textContent = 'エラー';
      return false;
    }
  }

  async function loadEvents() {
    eventsBody.innerHTML = '';
    eventsTable.hidden = true;
    noEvents.hidden = true;
    eventsLoading.hidden = false;
    try {
      const items = await api('/api/calendar/list');
      eventsLoading.hidden = true;
      if (!items || items.length === 0) {
        noEvents.hidden = false;
        return;
      }
      eventsTable.hidden = false;
      for (const it of items) {
        const tr = document.createElement('tr');
        const summary = it.summary || '(無題)';
        const start = (it.start && (it.start.dateTime||it.start.date)) || '';
        const end   = (it.end   && (it.end.dateTime||it.end.date)) || '';
        tr.innerHTML = `
          <td>${summary}</td>
          <td>${fmtLocal(start)}</td>
          <td>${fmtLocal(end)}</td>
          <td title="${(it.description||'').replace(/"/g,'&quot;')}">${(it.description||'')}</td>
          <td>
            <button class="small" data-id="${it.id}" onclick="deleteEvent('${it.id}', this)">削除</button>
            <button class="small" data-id="${it.id}" onclick="openUpdatePrompt('${it.id}')">編集</button>
          </td>
        `;
        eventsBody.appendChild(tr);
      }
    } catch (e) {
      eventsLoading.textContent = '予定の取得に失敗しました: ' + (e.message || e);
      console.error(e);
    }
  }

  async function addEvent() {
    const title = titleInput.value.trim();
    const startRaw = startInput.value;   // datetime-local 的值 (e.g. "2025-11-10T14:00")
    const endRaw   = endInput.value;
    const desc  = descInput.value.trim();

    // 前端校验
    if (!title) { alert('请输入标题'); return; }
    if (!startRaw) { alert('请输入开始时间'); return; }

    // 解析时间并检查有效性
    const startDate = new Date(startRaw);
    if (isNaN(startDate.getTime())) {
      alert('开始时间无效，请确认输入（datetime-local）');
      console.error('Invalid startRaw:', startRaw);
      return;
    }
    const startIso = startDate.toISOString();

    let endIso = null;
    if (endRaw) {
      const endDate = new Date(endRaw);
      if (isNaN(endDate.getTime())) {
        alert('结束时间无效，请确认输入（datetime-local）');
        console.error('Invalid endRaw:', endRaw);
        return;
      }
      endIso = endDate.toISOString();
    }

    const payload = { title, start: startIso, end: endIso, description: desc };

    // DEBUG: 打印 payload，便于查看发送内容
    console.log('POST /api/calendar/add payload:', payload);

    try {
      const res = await fetch('/api/calendar/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      // 更详细的错误处理
      if (!res.ok) {
        const text = await res.text().catch(()=>null);
        console.error('Server error response:', res.status, text);
        throw new Error('サーバーエラー: ' + res.status + ' ' + (text || res.statusText));
      }

      const created = await res.json();
      console.log('created event:', created);
      await loadEvents();
      addForm.reset();
    } catch (e) {
      alert('追加に失敗しました: ' + (e.message || e));
      console.error(e);
    }
  }

  btnAdd.addEventListener('click', addEvent);
  btnClear.addEventListener('click', () => addForm.reset());
  btnRefresh.addEventListener('click', loadEvents);

  // 編集ダイアログ（簡易）
  window.openUpdatePrompt = function(id) {
    const newTitle = prompt('新しいタイトル（キャンセルで中止）');
    if (newTitle === null) return;
    const newStart = prompt('開始日時（ISO形式、空欄のままなら変更なし）');
    const newEnd   = prompt('終了日時（ISO形式、空欄のままなら変更なし）');
    const newDesc  = prompt('説明（空欄で未変更）');
    const payload = { id };
    if (newTitle) payload.summary = newTitle;
    if (newStart) payload.start = newStart;
    if (newEnd) payload.end = newEnd;
    if (newDesc !== null) payload.description = newDesc;
    fetch('/api/calendar/update', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).then(r => {
      if (!r.ok) throw new Error('update failed ' + r.status);
      return r.json();
    }).then(()=> loadEvents())
      .catch(e => alert('更新に失敗しました: ' + e.message));
  };

  // 初期化
  (async () => {
    await checkAuth();
    await loadEvents();
  })();
</script>
</body>
</html>
