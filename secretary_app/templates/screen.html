<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 截图与录屏工具</title>
  <style>
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #141e30, #243b55);
      color: #fff;
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 30px;
      color: #9dc1ff;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 14px 26px;
      border: none;
      border-radius: 10px;
      background: #4e73df;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
    }
    .btn:hover { background: #3758d1; transform: scale(1.05); }
    .btn:active { transform: scale(0.95); }
    .status {
      margin-top: 25px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      font-size: 1rem;
      width: 70%;
      margin-left: auto;
      margin-right: auto;
      word-break: break-all;
    }
    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>🧩 Windows 截图与录屏工具</h1>

  <div>
    <button id="btn-screenshot" class="btn">📸 一键截图</button>
    <button id="btn-start" class="btn">🎥 开始录屏</button>
    <button id="btn-stop" class="btn">⏹ 停止录屏</button>
  </div>

  <div id="status" class="status">状态：就绪</div>

  <footer>
    Flask + Python 实现 • 可以在 Windows 本地服务器运行<br>
    截图与录屏文件保存在 <code>screenshots/</code> 文件夹中
  </footer>

  <script>
    const statusBox = document.getElementById("status");

    async function callAPI(url) {
      try {
        const res = await fetch(url, { method: "POST" });
        return await res.json();
      } catch (err) {
        console.error(err);
        return { status: "error", message: "请求失败" };
      }
    }

    document.getElementById("btn-screenshot").onclick = async () => {
      statusBox.textContent = "状态：截图中...";
      const res = await callAPI("/api/screenshot");
      if (res.path) {
        statusBox.textContent = `✅ 截图成功：${res.path}`;
      } else {
        statusBox.textContent = `❌ 截图失败：${res.message || '未知错误'}`;
      }
    };

    document.getElementById("btn-start").onclick = async () => {
      statusBox.textContent = "状态：开始录屏...";
      const res = await callAPI("/api/start_record");
      if (res.path) {
        statusBox.textContent = `🎥 正在录制中：${res.path}`;
      } else {
        statusBox.textContent = `❌ 录屏启动失败：${res.message || '未知错误'}`;
      }
    };

    document.getElementById("btn-stop").onclick = async () => {
      statusBox.textContent = "状态：停止录制中...";
      const res = await callAPI("/api/stop_record");
      if (res.message) {
        statusBox.textContent = `⏹ ${res.message}`;
      } else {
        statusBox.textContent = "❌ 停止录制失败";
      }
    };
  </script>
</body>
</html>
