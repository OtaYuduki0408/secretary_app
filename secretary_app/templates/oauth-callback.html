<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>認証コールバック</title>
    <script type="text/javascript">
        window.onload = function() {
            // URLのハッシュフラグメントからアクセストークンを抽出
            const params = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = params.get('access_token');

            if (accessToken) {
                // 親ウィンドウにアクセストークンを渡す
                if (window.opener && window.opener.receiveAccessToken) {
                    window.opener.receiveAccessToken(accessToken);
                    window.close(); // 認証ウィンドウを閉じる
                } else {
                    document.body.textContent = '認証成功しましたが、親ウィンドウとの連携に失敗しました。';
                }
            } else {
                document.body.textContent = '認証に失敗しました。アクセストークンが見つかりません。';
            }
        };
    </script>
</head>
<body>
    <h2>認証処理中...</h2>
    <script>
        console.log("OAuthコールバック処理を開始します。");
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get("access_token");
 
        if (token && window.opener) {
            if (window.opener.receiveAccessToken) {
            window.opener.receiveAccessToken(token); 
        } else {
            window.opener.postMessage({
                type: 'oauth_token',
                token: token
            }, '*');
        }
        window.close();
        } else {
            document.body.innerHTML = "<p>認証に失敗しました。</p>";
            console.error("アクセストークンが取得できませんでした。");
        }
    </script>
</body>
</html>
