<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>認証コールバック</title>
    <script type="text/javascript">
        window.onload = function() {
            // URLのハッシュフラグメントからアクセストークンを抽出
            const params = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = params.get('access_token');

            if (accessToken) {
                // 親ウィンドウにアクセストークンを渡す
                if (window.opener && window.opener.receiveAccessToken) {
                    window.opener.receiveAccessToken(accessToken);
                    window.close(); // 認証ウィンドウを閉じる
                } else {
                    document.body.textContent = '認証成功しましたが、親ウィンドウとの連携に失敗しました。';
                }
            } else {
                document.body.textContent = '認証に失敗しました。アクセストークンが見つかりません。';
            }
        };
    </script>
</head>
<body>
    認証処理中...
</body>
</html>
