<!DOCTYPE html>
<html>
<head>
    <title>Google Auth Callback</title>
    <script>
        window.onload = function() {
            if (window.location.hash) {
                const params = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = params.get('access_token');

                // Check if opener and scheduleManager exist before calling setAccessToken
                if (window.opener && window.opener.manager) {
                    window.opener.manager.setAccessToken(accessToken);
                } else {
                    // Optional: handle the case where the opener is not available
                    console.error("Opener window or scheduleManager not found.");
                }
                
                // Close the popup window
                window.close();
            } else {
                // Optional: handle the case where there is no hash in the URL
                console.error("No auth token found in URL hash.");
                window.close();
            }
        };
        const token = "{{ token }}";
            if (token) {
                window.opener && window.opener.receiveAccessToken(token);
                window.close();
        }
    </script>
</head>
<body>
    <p>Authenticating... Please wait.</p>
</body>
</html>
