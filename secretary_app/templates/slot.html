<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>JUGGLER (Space / Z X C)</title>
  <link rel="stylesheet" href="../css/slot.css" />
</head>
<body>
  <div class="cabinet">
    <div class="top-arch">
      <div class="top-marquee">
        <div class="sevens"><i></i><i></i><i></i></div>
        <div class="title">JUGGLER</div>
      </div>
    </div>

    <div class="panel">
      <!-- 左 3 2 1 柱 -->
      <div class="side left">
        <div class="lamp-col">
          <div class="num"><span>3</span></div>
          <div class="num"><span>2</span></div>
          <div class="num"><span>1</span></div>
        </div>
      </div>

      <!-- 中央 リール窓 -->
      <div class="reel-window">
        <div class="bezel"></div>
        <div class="reels">
          <div class="reel"></div>
          <div class="reel"></div>
          <div class="reel"></div>
        </div>
        <div class="payline"></div>
      </div>

      <!-- 右 ランプ -->
      <div class="side right">
        <div class="indicator"><div id="lamp-start"  class="dot"></div><span>Start</span></div>
        <div class="indicator"><div id="lamp-replay" class="dot"></div><span>Replay</span></div>
        <div class="indicator"><div id="lamp-wait"   class="dot"></div><span>Wait</span></div>
        <!-- GOGO Lamp -->
        <img id="lamp-gogo" src="../img/gogo.png" alt="GOGO!" aria-hidden="true" />
      </div>
    </div>

    <!-- メーター -->
    <div class="meters">
      <div class="meter">
        <div class="label">CREDIT</div>
        <div id="credit" class="digits">000</div>
      </div>
      <div class="meter">
        <div class="label">COUNT</div>
        <div id="count" class="digits">000</div>
      </div>
      <div class="meter">
        <div class="label">PAYOUT</div>
        <div id="payout" class="digits">000</div>
      </div>
    </div>

    <!-- 役名表示（任意） -->
    <div id="yaku" style="margin:6px 4px 0;opacity:.9">役：---</div>

    <!-- ボタン類 -->
    <div class="bottom">
      <div class="buttons">
        <button id="spin" class="btn">SPIN (Space)</button>
        <div class="stops">
          <button id="goL" class="btn small">Z</button>
          <button id="goM" class="btn small">X</button>
          <button id="goR" class="btn small">C</button>
        </div>
      </div>
      <div class="howto">Space：スタート/再スタート ｜ Z：左停止　X：中停止　C：右停止（目押し可）</div>
    </div>
  </div>

  <script src="../js/slot.js"></script>
</body>
</html>
