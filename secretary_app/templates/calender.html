<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>カレンダー管理</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
</head>
<body>
  <!-- 背景 -->
  <div class="page-bg" aria-hidden="true"></div>

  <!-- ヘッダー -->
  <header class="header">
    <h1 class="title">カレンダー管理</h1>
    <div class="actions">
      <a href="{{ url_for('main') }}" class="btn ghost">メインへ戻る</a>
    </div>
  </header>

  <!-- コンテナ -->
  <main class="container">
    <!-- 追加 -->
    <section class="card">
      <h2 class="card-title">イベント追加</h2>

      <div class="grid g-2">
        <label class="field">
          <span class="label">タイトル</span>
          <input id="event-title" class="input" placeholder="例：打ち合わせ">
        </label>

        <label class="field">
          <span class="label">説明</span>
          <input id="event-desc" class="input" placeholder="任意（場所・メモなど）">
        </label>
      </div>

      <div class="grid g-2">
        <label class="field">
          <span class="label">開始日時</span>
          <input id="event-start" type="datetime-local" class="input">
        </label>

        <label class="field">
          <span class="label">終了日時</span>
          <input id="event-end" type="datetime-local" class="input">
        </label>
      </div>

      <div class="card-actions">
        <button id="add-event-button" class="btn success">＋ 追加</button>
      </div>
    </section>

    <!-- 削除 -->
    <section class="card">
      <h2 class="card-title">イベント削除</h2>

      <div class="grid">
        <label class="field full">
          <span class="label">イベントID</span>
          <input id="event-id" class="input" placeholder="削除したいイベントのID">
        </label>
      </div>

      <div class="card-actions">
        <button id="delete-event-button" class="btn danger">削除</button>
      </div>
    </section>

    <!-- 確認 -->
    <section class="card">
      <h2 class="card-title">イベント確認</h2>

      <div class="grid g-2">
        <label class="field">
          <span class="label">開始日</span>
          <input id="check-start" type="date" class="input">
        </label>

        <label class="field">
          <span class="label">終了日</span>
          <input id="check-end" type="date" class="input">
        </label>
      </div>

      <div class="card-actions">
        <button id="check-event-button" class="btn ghost">確認</button>
      </div>
    </section>

    <!-- ログ -->
    <section class="card">
      <h2 class="card-title">ログ</h2>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const $ = s => document.querySelector(s);
      const logEl = $("#log");

      const log = (msg, type = 'info') => {
        const t = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.textContent = `[${t}] ${msg}`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      };

      // --- API Functions ---
      const api = {
        async addEvent(title, startTime, endTime, description) {
          try {
            const res = await fetch('/api/local_calendar/events', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title, start_time: startTime, end_time: endTime, description }),
            });
            const data = await res.json();
            console.log("Server response:", res.status, data); // For debugging
            if (!res.ok) throw new Error(data.error || `HTTP error! status: ${res.status}`);
            log(`イベントを追加しました: 「${data.title}」 (ID: ${data.id})`, 'success');
          } catch (e) {
            log(`イベントの追加に失敗しました: ${e.message}`, 'error');
            console.error("Add event failed:", e); // For debugging
          }
        },
        async deleteEvent(eventId) {
          if (!eventId) {
            log('削除するイベントのIDを入力してください。', 'error');
            return;
          }
          try {
            const res = await fetch(`/api/local_calendar/events/${eventId}`, {
              method: 'DELETE',
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'サーバーエラー');
            log(`イベント(ID: ${eventId})を削除しました。`, 'success');
          } catch (e) {
            log(`イベント(ID: ${eventId})の削除に失敗しました: ${e.message}`, 'error');
          }
        },
        async listEvents(startTime, endTime) {
           try {
            let url = '/api/local_calendar/events';
            const params = new URLSearchParams();
            if (startTime) params.append('start_time', new Date(startTime).toISOString());
            if (endTime) params.append('end_time', new Date(endTime).toISOString());
            if (params.toString()) url += `?${params.toString()}`;

            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'サーバーエラー');

            logEl.innerHTML = ''; // ログをクリア
            if (data.length === 0) {
              log('指定された期間にイベントはありません。');
              return;
            }
            log(`${data.length}件のイベントが見つかりました:`);
            data.forEach(event => {
                const start = new Date(event.start_time).toLocaleString('ja-JP');
                const end = new Date(event.end_time).toLocaleString('ja-JP');
                log(`- ID:${event.id}, ${event.title} (${start} ~ ${end})`);
            });
           } catch (e) {
            log(`イベントの取得に失敗しました: ${e.message}`, 'error');
           }
        }
      };

      // --- Event Listeners ---
      $("#add-event-button").addEventListener("click", async () => {
        const start = $("#event-start").value;
        const end = $("#event-end").value;
        if (!start || !end) {
            log('開始日時と終了日時を入力してください。', 'error');
            return;
        }
        await api.addEvent(
          $("#event-title").value || "無題のイベント",
          new Date(start).toISOString(),
          new Date(end).toISOString(),
          $("#event-desc").value || ""
        );
        $("#event-title").value = "";
        $("#event-desc").value = "";
        $("#event-start").value = "";
        $("#event-end").value = "";
      });

      $("#delete-event-button").addEventListener("click", async () => {
        const id = $("#event-id").value.trim();
        await api.deleteEvent(id);
        $("#event-id").value = "";
      });

      $("#check-event-button").addEventListener("click", async () => {
        await api.listEvents($("#check-start").value, $("#check-end").value);
      });

      log('ローカルカレンダーの準備ができました。');
    });
  </script>
</body>
</html>
