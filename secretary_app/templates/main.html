<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Secretary — Main</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- 背景：多層パララックス（UIの背面） -->
  <div class="parallax" aria-hidden="true">
    <div id="plx-back"  class="plx-layer back"></div>
    <div id="plx-mid"   class="plx-layer mid"></div>
    <div id="plx-front" class="plx-layer front"></div>
  </div>

  <!-- 中央の可読性を上げる暗幕 -->
  <div class="ui-backdrop" aria-hidden="true"></div>

  <main class="shell">
    <div aria-hidden="true"></div>

    <section aria-label="メイン操作" class="ui-stack">
      <div class="mic-wrap">
        <button class="mic-btn glass" aria-label="音声入力を開始">
          <div class="mic-surface" aria-hidden="true">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" role="img" aria-hidden="true">
              <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e6eef8"/>
              </linearGradient></defs>
              <path d="M8 9a4 4 0 0 1 8 0v3a4 4 0 1 1-8 0V9Z" fill="url(#g1)"/>
              <path d="M5 11.5a7 7 0 0 0 14 0" stroke="#a9c4ff" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M12 18v3" stroke="#d7e6ff" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
        </button>
      </div>
      <!--JSで下記のformのid="search"を使って読み込んでいます。idをけさないでください。(太田)-->
      <form id="search" class="search glass" role="search" aria-label="検索フォーム" onsubmit="return false;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="#e7edf5" stroke-width="1.7"/>
          <path d="M20 20l-3.6-3.6" stroke="#e7edf5" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <!--以下のinputのname="search"の部分を変更しないで。jsで監視してます。(太田)-->
        <input id="searchbox" type="text" inputmode="search" name="search" placeholder="入力" aria-label="入力" />
      </form>
    </section>

    <div aria-hidden="true"></div>

    <!-- 右下アクション（収支管理 / カレンダー） -->
    <div class="fab-group">
      <a class="finance-btn fab" href="/expense" aria-label="収支管理を開く" title="収支管理">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3.5" width="18" height="17" rx="4" fill="#1f2a33" stroke="#a8b6c6" stroke-width="1.2"/>
          <path d="M8 6l4 5 4-5" stroke="#a8b6c6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 13h6M9 15h6M12 11v6" stroke="#7aa8ff" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </a>

      <button class="calendar-btn fab" aria-label="カレンダーを開く" title="カレンダー">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5.5" width="18" height="15" rx="3" fill="#24303a" stroke="#a8b6c6" stroke-width="1.2"/>
          <path d="M8 3v4M16 3v4" stroke="#a8b6c6" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M3 9.5h18" stroke="#a8b6c6" stroke-width="1.2"/>
          <rect x="7" y="12" width="3" height="3" rx="0.8" fill="#7aa8ff"/>
          <rect x="12" y="12" width="3" height="3" rx="0.8" fill="#7aa8ff" opacity=".85"/>
          <rect x="7" y="16" width="3" height="3" rx="0.8" fill="#7aa8ff" opacity=".7"/>
        </svg>
        <span class="badge" aria-hidden="true">Today</span>
      </button>
    </div>
  </main>

  <!-- 解析インジケーター（非表示から開始） -->
<div id="ai-indicator" aria-live="polite" style="position:fixed;right:14px;bottom:14px;z-index:14000;display:none;">
  <div style="min-width:240px;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.45);color:#e5e7eb">
    <div id="aii-title" style="font-weight:700;margin-bottom:8px">解析中…</div>
    <div id="aii-steps" style="display:flex;gap:6px;margin-bottom:8px">
      <span style="flex:1;height:6px;background:#475569;border-radius:999px;opacity:.45"></span>
      <span style="flex:1;height:6px;background:#475569;border-radius:999px;opacity:.45"></span>
      <span style="flex:1;height:6px;background:#475569;border-radius:999px;opacity:.45"></span>
    </div>
    <div id="aii-label" style="font-size:.92rem;opacity:.85">準備中</div>
  </div>
</div>

<script>
(() => {
  const box   = document.getElementById('ai-indicator');
  const title = document.getElementById('aii-title');
  const label = document.getElementById('aii-label');
  const bars  = Array.from(document.querySelectorAll('#aii-steps span'));
  let steps = ['目的判定','詳細抽出','結果反映'];

  function setActive(n){
    bars.forEach((b,i)=> b.style.background = i < n ? '#93c5fd' : '#475569');
    bars.forEach((b,i)=> b.style.opacity = i < n ? '1' : '.45');
    label.textContent = steps[Math.max(0, Math.min(n-1, steps.length-1))] || '処理中';
  }

  document.addEventListener('analysis:start', (e)=>{
    steps = e.detail?.steps || steps;
    title.textContent = '解析中…';
    label.textContent = '準備中';
    setActive(0);
    box.style.display = 'block';
  });

  document.addEventListener('analysis:step', (e)=>{
    const idx = (e.detail?.index|0);
    if (e.detail?.label) steps[idx-1] = e.detail.label;
    setActive(idx);
  });

  document.addEventListener('analysis:end', ()=>{
    setActive(steps.length);
    title.textContent = '完了';
    setTimeout(()=> box.style.display = 'none', 700);
  });
})();
</script>


  <!-- ★ JACKPOT：2枚カットイン -->
<div id="jackpot-cameo" aria-hidden="true">
  <imd="cameo1" src="{{ url_for('static', filename='img/videoframe_79969.png') }}" alt="cameo-1" />
  <img id="cameo2" src="{{ url_for('static', filename='img/videoframe_86269') }}" alt="cameo-2" />
</div>

<!-- ★ SLOT 画面 -->
<div id="slot-overlay" aria-hidden="true">
  <div class="slot-wrap">
    <button id="slot-close" aria-label="閉じる">×</button>
    <h2 class="slot-title">LUCKY SLOT</h2>
    <div class="reels">
      <div class="reel"><div class="cell" id="r0">7</div></div>
      <div class="reel"><div class="cell" id="r1">7</div></div>
      <div class="reel"><div class="cell" id="r2">7</div></div>
    </div>
    <div class="slot-controls">
      <button id="slot-spin">SPIN</button>
    </div>
    <p id="slot-msg" style="min-height:1.6em;margin:.6rem 0 0;color:#cde4ff;"></p>
  </div>
</div>


  <!-- Bites the Dust（2秒表示） -->
<!-- ★ Bites the Dust（YouTube動画版） -->
<div id="btd" class="btd-overlay" aria-hidden="true" hidden>
  <div class="btd-player-frame">
    <div id="btd-player"></div>
  </div>
  <!-- 任意のスキップ（不要なら削除OK） -->
  <button id="btd-skip" class="btd-skip" aria-label="スキップ">SKIP</button>
</div>


  <!-- オラオラ吹き出し（2秒） -->
  <div id="ora" aria-hidden="true">
    <img src="{{ url_for('static', filename='img/ora.png') }}" alt="オラオラ！">
  </div>

  <!-- ひびの親 -->
  <div id="cracks" aria-hidden="true"></div>

  <!-- 砕け散るガラス -->
  <div id="shatter" aria-hidden="true"></div>

  <!--以下2行、JSの呼び出し部分です。変更しないでください。-->
  <script src="{{ url_for('static', filename='js/Parallax_and_Theme_rotation.js') }}" type="module"></script> <!--ヒビとテーマの回転のJS-->
</body>
</html>
