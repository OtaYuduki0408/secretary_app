<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>収支管理統計</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/finance.css') }}">
</head>
<body>

  <!-- 右上：メインに戻る -->
  <div class="header" style="margin: 20px auto 0; max-width: 980px; padding: 0 20px;">
    <div style="flex:1"></div>
    <a class="link-btn" href="{{ url_for('main') }}" title="メインに戻る" aria-label="メインに戻る">
      <!-- 左矢印アイコン -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px; margin-right:6px">
        <path d="M15 19l-7-7 7-7" stroke="#eaf1f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      メインに戻る
    </a>
  </div>

  <div class="fd-wrap">
    <!-- サマリー -->
    <section class="fd-section">
      <h2 class="fd-title">サマリー</h2>
      <div class="fd-summary">
        <div class="fd-kpi">
          <h3>現在の所持金</h3>
          <p id="current-balance" class="fd-num">-- 円</p>
        </div>
        <div class="fd-kpi">
          <h3>目標金額</h3>
          <p id="goal-amount" class="fd-num">-- 円</p>
        </div>
        <div class="fd-kpi">
          <h3>今月の使用額</h3>
          <p id="monthly-expense" class="fd-num">-- 円</p>
        </div>
      </div>
    </section>

    <section class="fd-section">
      <h2 class="fd-title">一覧</h2>
      <div class="fd-controls">
        
        <div id="filterType" class="fd-radio-group">
            <input type="radio" id="typeAll" name="typeFilter" value="all" checked>
            <label for="typeAll">すべて</label>
            <input type="radio" id="typeExpense" name="typeFilter" value="expense">
            <label for="typeExpense">支出</label>
            <input type="radio" id="typeIncome" name="typeFilter" value="income">
            <label for="typeIncome">収入</label>
        </div>
        
        <input id="searchInput" class="fd-input" placeholder="検索…" />
        
        <select id="sortSelect" class="fd-select">
          <option value="date">日付順</option>
          <option value="amount">金額順</option>
        </select>
        
        <select id="filterCategory" class="fd-select" multiple size="3">
            <option value="all" selected>すべてのカテゴリ</option>
        </select>
      </div>

      <table id="financeTable">
        <thead>
          <tr>
                <th>日付</th>
                <th>タイプ</th>
                <th>カテゴリ</th>
                <th>内容</th>
                <th>金額</th>
            </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="fd-section">
      <h2 class="fd-title">グラフ</h2>
      <div 
        id="finance-data"
        data-income='{{ income_stats | tojson | safe }}'
        data-expense='{{ expense_stats | tojson | safe }}'
        data-all-records='{{ all_records | tojson | safe }}'>
      </div>

      <canvas id="incomeChart" width="400" height="200"></canvas>
      <canvas id="expenseChart" width="400" height="200"></canvas>
    </section>

    <section class="fd-section">
      <h2 class="fd-title">アチーブメント</h2>
      <div class="fd-badges">
        <div class="fd-badge is-unlocked">💰 初回目標設定</div>
        <div class="fd-badge">🔥 連続記録 7日</div>
        <div class="fd-badge">🧊 節約達成</div>
        <div class="fd-badge">📅 月次記録更新</div>
      </div>
    </section>

    <section class="fd-section">
      <h2 class="fd-title">設定</h2>
      <form id="settingsForm" class="fd-form">
        <label>目標金額
          <input id="inputGoal" type="number" placeholder="例: 100000" />
        </label>
        <label>通知設定
          <select id="notifySetting">
            <option value="on">ON</option>
            <option value="off">OFF</option>
          </select>
        </label>
        <button type="submit">保存</button>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/finance.js') }}" defer></script>
</body>
</html>
