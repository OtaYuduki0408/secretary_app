<!-- templates/finance.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>収支管理統計</title>
  <!-- 既存の finance.css を読み込む -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/finance.css') }}">
</head>
<body>

  <div class="fd-wrap">
    <!-- サマリー -->
    <section class="fd-section">
      <h2 class="fd-title">サマリー</h2>
      <div class="fd-summary">
        <div class="fd-kpi">
          <h3>現在の所持金</h3>
          <p id="current-balance" class="fd-num">-- 円</p>
        </div>
        <div class="fd-kpi">
          <h3>目標金額</h3>
          <p id="goal-amount" class="fd-num">-- 円</p>
        </div>
        <div class="fd-kpi">
          <h3>今月の使用額</h3>
          <p id="monthly-expense" class="fd-num">-- 円</p>
        </div>
      </div>
    </section>

    <!-- 一覧 -->
    <section class="fd-section">
      <h2 class="fd-title">一覧</h2>
      <div class="fd-controls">
        <input id="searchInput" class="fd-input" placeholder="検索…" />
        <select id="sortSelect" class="fd-select">
          <option value="date">日付順</option>
          <option value="amount">金額順</option>
        </select>
        <select id="filterCategory" class="fd-select">
          <option value="all">全カテゴリ</option>
          <option value="食費">食費</option>
          <option value="交通費">交通費</option>
          <option value="娯楽">娯楽</option>
        </select>
      </div>

      <table id="financeTable">
        <thead>
          <tr><th>日付</th><th>カテゴリ</th><th>内容</th><th>金額</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- グラフ -->
    <section class="fd-section">
      <h2 class="fd-title">グラフ</h2>
      <div class="fd-charts">
        <canvas id="pieChart" class="fd-chart"></canvas>
        <canvas id="lineChart" class="fd-chart"></canvas>
        <canvas id="cumulativeChart" class="fd-chart"></canvas>
      </div>
    </section>

    <!-- アチーブメント -->
    <section class="fd-section">
      <h2 class="fd-title">アチーブメント</h2>
      <div class="fd-badges">
        <div class="fd-badge is-unlocked">💰 初回目標設定</div>
        <div class="fd-badge">🔥 連続記録 7日</div>
        <div class="fd-badge">🧊 節約達成</div>
        <div class="fd-badge">📅 月次記録更新</div>
      </div>
    </section>

    <!-- 設定 -->
    <section class="fd-section">
      <h2 class="fd-title">設定</h2>
      <form id="settingsForm" class="fd-form">
        <label>目標金額
          <input id="inputGoal" type="number" placeholder="例: 100000" />
        </label>
        <label>通知設定
          <select id="notifySetting">
            <option value="on">ON</option>
            <option value="off">OFF</option>
          </select>
        </label>
        <button type="submit">保存</button>
      </form>
    </section>
  </div>

  <!-- JS は </body> の直前で読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/finance.js') }}" defer></script>
</body>
</html>
