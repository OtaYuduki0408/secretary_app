<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>収支管理統計</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/finance.css') }}">
</head>
<body>

  <div class="fd-wrap">
    <div class="fd-button-container">
      <a href="{{ url_for('main', internal_nav=true) }}" class="link-btn">メインに戻る</a>
    </div>
        <section class="fd-section">
      <h2 class="fd-title">サマリー</h2>
            <div class="fd-summary">
            <div class="fd-kpi">
              <h3>現在の所持金</h3>
              <p id="current-balance" class="fd-num">-- 円</p>
            </div>
            <div class="fd-kpi">
              <h3>今月の使用額</h3>
              <p id="monthly-expense" class="fd-num">-- 円</p>
            </div>
            <div class="fd-kpi">
              <h3>今月の目標額</h3>
              <p id="goal-amount" class="fd-num">
                {% if goal_amount is not none %}
                  {{ '{:,.0f}'.format(goal_amount) }} 円
                {% else %}
                  -- 円
                {% endif %}
              </p>
            </div>
            <div class="fd-kpi">
              <h3>今月の収入</h3>
              <p id="monthly-income" class="fd-num">-- 円</p>
            </div>
            <div class="fd-kpi">
              <h3>今日の使用額</h3>
              <p id="daily-expense" class="fd-num">-- 円</p>
            </div>
            <div class="fd-kpi">
              <h3>今日の使用額(必需品抜き)</h3>
              <p id="daily-expense-no-necessities" class="fd-num">-- 円</p>
            </div>
          </div>     </section>

    <section class="fd-section">
      <h2 class="fd-title">一覧</h2>
      <div class="fd-controls">
        <div id="filterType" class="fd-radio-group">
            <input type="radio" id="typeAll" name="typeFilter" value="all" checked>
            <label for="typeAll">すべて</label>
            <input type="radio" id="typeExpense" name="typeFilter" value="expense">
            <label for="typeExpense">支出</label>
            <input type="radio" id="typeIncome" name="typeFilter" value="income">
            <label for="typeIncome">収入</label>
        </div>
        
        <input id="searchInput" class="fd-input" placeholder="検索…" />
        
        <select id="sortSelect" class="fd-select">
          <option value="date">日付順</option>
          <option value="amount">金額順</option>
        </select>
        
        <select id="filterCategory" class="fd-select" multiple size="3">
            <option value="all" selected>すべてのカテゴリ</option>
        </select>

        <div class="fd-date-range">
            <div class="fd-date-input-group">
                <input type="date" id="startDate" class="fd-input" placeholder="開始日">
                <button type="button" class="fd-wheel-btn" data-target="startDate" aria-label="ホイールで開始日を選ぶ">🗓</button>
            </div>
            <div class="fd-date-input-group">
                <input type="date" id="endDate" class="fd-input" placeholder="終了日">
                <button type="button" class="fd-wheel-btn" data-target="endDate" aria-label="ホイールで終了日を選ぶ">🗓</button>
            </div>
        </div>
        </div>
      
      <details open>
        <summary class="fd-collapsible-summary fd-list-summary">一覧</summary>
        <div class="fd-table-actions">
          <button id="finance-delete-mode-btn" class="fd-action-btn" type="button">削除モード</button>
          <button id="finance-execute-delete-btn" class="fd-action-btn danger" type="button" style="display:none;">選択削除</button>
        </div>
        <table id="financeTable">
          <thead>
            <tr>
                  <th class="fd-check-col" style="display:none;"><input type="checkbox" id="finance-select-all"></th>
                  <th>日付</th>
                  <th>タイプ</th>
                  <th>カテゴリ</th>
                  <th>メモ</th>
                  <th>金額</th>
              </tr>
          </thead>
          <tbody></tbody>
        </table>
      </details>
      </section>

    <section class="fd-section">
      <details open>
        <summary class="fd-collapsible-summary fd-chart-summary">グラフ</summary>
        <div class="fd-charts">
          <canvas id="incomeChart" class="fd-chart"></canvas>
          <canvas id="expenseChart" class="fd-chart"></canvas>
        </div>
        <div 
          id="finance-data"
          data-income='{{ income_stats | tojson | safe }}'
          data-expense='{{ expense_stats | tojson | safe }}'
          data-all-records='{{ all_records | tojson | safe }}'
          style="display: none;">
        </div>
      </details>
    </section>
    

    <section class="fd-section">
      <h2 class="fd-title">設定</h2>
      <form id="settingsForm" class="fd-form">
        <label>目標金額
          <input
            id="inputGoal"
            type="number"
            placeholder="例: 100000"
            value="{{ goal_amount or '' }}"
          />
        </label>
        <label>通知設定
          <select id="notifySetting">
            <option value="on">ON</option>
            <option value="off">OFF</option>
          </select>
        </label>
        <button type="submit">保存</button>
      </form>
    </section>
  </div>


<div id="fdWheel" class="fd-wheel-backdrop" hidden>
  <div class="fd-wheel-dialog" role="dialog" aria-modal="true" aria-labelledby="fdWheelTitle">
    <div class="fd-wheel-header">
      <span id="fdWheelTitle">Pick a date</span>
    </div>

    <div class="fd-wheel-body">
      <div class="fd-wheel-column">
        <label for="fdWheelYear" class="fd-wheel-label">年</label>
        <select id="fdWheelYear" class="fd-wheel-select"></select>
      </div>
      <div class="fd-wheel-column">
        <label for="fdWheelMonth" class="fd-wheel-label">月</label>
        <select id="fdWheelMonth" class="fd-wheel-select"></select>
      </div>
      <div class="fd-wheel-column">
        <label for="fdWheelDay" class="fd-wheel-label">日</label>
        <select id="fdWheelDay" class="fd-wheel-select"></select>
      </div>

      <div class="fd-wheel-highlight"></div>
    </div>

    <div class="fd-wheel-actions">
      <button type="button" class="fd-wheel-cancel">キャンセル</button>
      <button type="button" class="fd-wheel-ok">決定</button>
    </div>
  </div>
</div>

<div id="finance-edit-overlay" class="fd-edit-overlay" hidden>
  <div class="fd-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="finance-edit-title">
    <h3 id="finance-edit-title">収支を編集</h3>
    <div class="fd-edit-grid">
      <label>年
        <input id="finance-edit-year" type="number" min="2000" max="2100" class="fd-input">
      </label>
      <label>月
        <input id="finance-edit-month" type="number" min="1" max="12" class="fd-input">
      </label>
      <label>日
        <input id="finance-edit-day" type="number" min="1" max="31" class="fd-input">
      </label>
      <label>時
        <input id="finance-edit-hour" type="number" min="0" max="23" class="fd-input">
      </label>
      <label>分
        <input id="finance-edit-minute" type="number" min="0" max="59" class="fd-input">
      </label>
      <label>タイプ
        <select id="finance-edit-type" class="fd-select">
          <option value="expense">支出</option>
          <option value="income">収入</option>
        </select>
      </label>
      <label>カテゴリ
        <input id="finance-edit-category" type="text" class="fd-input">
      </label>
      <label>金額
        <input id="finance-edit-amount" type="number" min="0" class="fd-input">
      </label>
      <label>メモ
        <input id="finance-edit-memo" type="text" class="fd-input">
      </label>
    </div>
    <div class="fd-edit-actions">
      <button id="finance-edit-cancel" type="button">キャンセル</button>
      <button id="finance-edit-save" type="button">保存</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/finance.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app_settings_apply.js') }}"></script>
</body></html>
