<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google日历和邮件管理器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        .auth-section {
            grid-column: 1 / -1;
            text-align: center;
            background: #e8f4ff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn {
            padding: 14px 24px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: #5f6368;
        }
        
        .btn-success {
            background: #34a853;
        }
        
        .btn-danger {
            background: #ea4335;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: 600;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .log-container {
            grid-column: 1 / -1;
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-left: 3px solid #667eea;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .events-list {
            margin-top: 15px;
        }
        
        .event-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #34a853;
        }
        
        .event-summary {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .event-time {
            color: #666;
            font-size: 14px;
        }
        
        .token-info {
            background: #e8f0fe;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
            word-break: break-all;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Google日历和邮件管理器</h1>
            <p>统一管理您的日历事件和邮件发送</p>
        </div>
        
        <div class="main-content">
            <!-- 认证区域 -->
            <div class="section auth-section">
                <h2>身份验证</h2>
                <button class="btn" id="authBtn">授权 Google 访问</button>
                <div class="token-info hidden" id="tokenInfo">
                    <strong>授权状态：</strong><span id="authStatus">未授权</span>
                    <br>
                    <strong>Access Token：</strong><span id="accessTokenDisplay"></span>
                </div>
                <input type="text" id="manualToken" placeholder="或手动输入 Access Token" style="margin-top: 10px;">
                <button class="btn btn-secondary" id="setTokenBtn">设置 Token</button>
            </div>
            
            <!-- 日历功能区域 -->
            <div class="section">
                <h2>📅 日历管理</h2>
                
                <div class="form-group">
                    <label for="eventTitle">事件标题</label>
                    <input type="text" id="eventTitle" placeholder="输入事件标题">
                </div>
                
                <div class="form-group">
                    <label for="eventDescription">事件描述</label>
                    <textarea id="eventDescription" placeholder="输入事件描述"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="eventStart">开始时间</label>
                    <input type="datetime-local" id="eventStart">
                </div>
                
                <div class="form-group">
                    <label for="eventEnd">结束时间</label>
                    <input type="datetime-local" id="eventEnd">
                </div>
                
                <button class="btn btn-success" id="addEventBtn">添加事件</button>
                <button class="btn" id="listEventsBtn">列出事件</button>
                
                <div class="events-list" id="eventsList"></div>
            </div>
            
            <!-- 邮件功能区域 -->
            <div class="section">
                <h2>📧 邮件发送</h2>
                
                <div class="form-group">
                    <label for="emailTo">收件人</label>
                    <input type="email" id="emailTo" placeholder="输入收件人邮箱">
                </div>
                
                <div class="form-group">
                    <label for="emailSubject">邮件主题</label>
                    <input type="text" id="emailSubject" placeholder="输入邮件主题">
                </div>
                
                <div class="form-group">
                    <label for="emailMessage">邮件内容</label>
                    <textarea id="emailMessage" placeholder="输入邮件内容"></textarea>
                </div>
                
                <button class="btn btn-success" id="sendEmailBtn">发送邮件</button>
                <button class="btn" id="listEmailsBtn">获取邮件列表</button>
            </div>
            
            <!-- 日志区域 -->
            <div class="log-container">
                <h3 style="color: #e2e8f0; margin-bottom: 15px;">操作日志</h3>
                <div id="logOutput"></div>
            </div>
        </div>
    </div>

    <!-- 加载 Google API -->
    <script src="https://apis.google.com/js/api.js"></script>
    
    <!-- 导入 ScheduleManager 类 -->
    <script type="module">
        // 导入 ScheduleManager 类
        import { ScheduleManager } from './static/js/ScheduleManager.js';
        
        
        // 初始化管理器
        window.manager = new ScheduleManager();
        
        // 获取DOM元素
        const authBtn = document.getElementById('authBtn');
        const setTokenBtn = document.getElementById('setTokenBtn');
        const addEventBtn = document.getElementById('addEventBtn');
        const listEventsBtn = document.getElementById('listEventsBtn');
        const sendEmailBtn = document.getElementById('sendEmailBtn');
        const listEmailsBtn = document.getElementById('listEmailsBtn');
        const tokenInfo = document.getElementById('tokenInfo');
        const authStatus = document.getElementById('authStatus');
        const accessTokenDisplay = document.getElementById('accessTokenDisplay');
        const manualToken = document.getElementById('manualToken');
        const logOutput = document.getElementById('logOutput');
        const eventsList = document.getElementById('eventsList');
        
        // 日志函数
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry`;
            logEntry.innerHTML = `<span style="color: #aaa;">[${timestamp}]</span> ${message}`;
            
            logOutput.appendChild(logEntry);
            logOutput.scrollTop = logOutput.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        // 授权按钮点击事件
        authBtn.addEventListener('click', () => {
            log('正在打开 Google 授权页面...', 'info');
            manager.handleAuthClick();
            
            // 监听消息（用于从弹出窗口接收token）
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'oauth_token') {
                    const token = event.data.token;
                    manualToken.value = token;
                    setAccessToken(token);
                }
            });
        });
        
        // 设置Token按钮点击事件
        setTokenBtn.addEventListener('click', () => {
            const token = manualToken.value.trim();
            if (token) {
                setAccessToken(token);
            } else {
                log('请输入有效的 Access Token', 'error');
            }
        });
        
        // 设置访问令牌
        function setAccessToken(token) {
            try {
                manager.setAccessToken(token);
                authStatus.textContent = '已授权';
                authStatus.style.color = '#34a853';
                accessTokenDisplay.textContent = token.substring(0, 50) + '...';
                tokenInfo.classList.remove('hidden');
                log('Access Token 设置成功，现在可以使用日历和邮件功能', 'success');
            } catch (error) {
                log(`设置 Token 失败: ${error.message}`, 'error');
            }
        }
        
        // 添加事件按钮点击事件
        addEventBtn.addEventListener('click', async () => {
            const title = document.getElementById('eventTitle').value;
            const description = document.getElementById('eventDescription').value;
            const start = document.getElementById('eventStart').value;
            const end = document.getElementById('eventEnd').value;
            
            if (!title) {
                log('请输入事件标题', 'error');
                return;
            }
            
            try {
                await manager.addEvent(title, description, start, end, log);
                // 清空表单
                document.getElementById('eventTitle').value = '';
                document.getElementById('eventDescription').value = '';
            } catch (error) {
                log(`添加事件失败: ${error.message}`, 'error');
            }
        });
        
        // 列出事件按钮点击事件
        listEventsBtn.addEventListener('click', async () => {
            const start = document.getElementById('eventStart').value || new Date().toISOString().split('T')[0];
            const end = document.getElementById('eventEnd').value || new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            
            try {
                const events = await manager.listEvents(start, end, log);
                displayEvents(events);
            } catch (error) {
                log(`获取事件列表失败: ${error.message}`, 'error');
            }
        });
        
        // 显示事件列表
        function displayEvents(events) {
            eventsList.innerHTML = '';
            
            if (!events || events.length === 0) {
                eventsList.innerHTML = '<div class="event-item">没有找到事件</div>';
                return;
            }
            
            events.forEach(event => {
                const eventItem = document.createElement('div');
                eventItem.className = 'event-item';
                
                const startTime = event.start.dateTime || event.start.date;
                const endTime = event.end.dateTime || event.end.date;
                
                eventItem.innerHTML = `
                    <div class="event-summary">${event.summary || '无标题'}</div>
                    <div class="event-time">开始: ${new Date(startTime).toLocaleString()}</div>
                    <div class="event-time">结束: ${new Date(endTime).toLocaleString()}</div>
                    ${event.description ? `<div style="margin-top: 5px; font-size: 13px; color: #666;">${event.description}</div>` : ''}
                    <button onclick="deleteEvent('${event.id}')" class="btn btn-danger" style="padding: 5px 10px; font-size: 12px; margin-top: 8px;">删除</button>
                `;
                
                eventsList.appendChild(eventItem);
            });
        }
        
        // 删除事件函数（需要暴露到全局）
        window.deleteEvent = async function(eventId) {
            try {
                await manager.deleteEvent(eventId, log);
                // 刷新事件列表
                listEventsBtn.click();
            } catch (error) {
                log(`删除事件失败: ${error.message}`, 'error');
            }
        };
        
        // 发送邮件按钮点击事件
        sendEmailBtn.addEventListener('click', async () => {
            const to = document.getElementById('emailTo').value;
            const subject = document.getElementById('emailSubject').value;
            const message = document.getElementById('emailMessage').value;
            
            if (!to || !subject || !message) {
                log('请填写完整的邮件信息', 'error');
                return;
            }
            
            try {
                await manager.sendEmail(to, subject, message, log);
                // 清空表单
                document.getElementById('emailTo').value = '';
                document.getElementById('emailSubject').value = '';
                document.getElementById('emailMessage').value = '';
            } catch (error) {
                log(`发送邮件失败: ${error.message}`, 'error');
            }
        });
        
        // 获取邮件列表按钮点击事件
        listEmailsBtn.addEventListener('click', async () => {
            try {
                await manager.listEmails(5, log);
            } catch (error) {
                log(`获取邮件列表失败: ${error.message}`, 'error');
            }
        });
        
        log('应用初始化完成，请点击授权按钮开始使用', 'info');
    </script>
</body>
</html>
