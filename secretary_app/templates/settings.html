<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Secretary — 設定</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      font-family: var(--app-font, inherit);
    }

    .settings-shell {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: clamp(18px, 4vw, 40px);
      gap: 18px;
    }

    .settings-card {
      width: min(760px, 92vw);
      background: rgba(10, 18, 28, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 18px;
      padding: clamp(18px, 4vw, 28px);
      color: #e2e8f0;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .settings-title {
      font-size: clamp(1.2rem, 2.4vw, 1.5rem);
      margin-bottom: 18px;
      font-weight: 700;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 18px;
    }

    .settings-actions a {
      color: #e2e8f0;
      text-decoration: none;
      border: 1px solid rgba(148, 163, 184, 0.5);
      border-radius: 999px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.6);
    }

    .settings-group {
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-group summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: rgba(30, 41, 59, 0.9);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-group summary::-webkit-details-marker {
      display: none;
    }

    .settings-group .details-body {
      padding: 16px;
      background: rgba(8, 15, 24, 0.7);
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 0.95rem;
      color: #cbd5f5;
    }

    .field input,
    .field select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
    }

    .field input[type="color"] {
      padding: 0;
      height: 42px;
      width: 96px;
      border: none;
      background: transparent;
    }

    .field-inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .field-inline input[type="range"] {
      flex: 1;
    }

    .hint {
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="settings-shell">
    <section class="settings-card">
      <div class="settings-actions">
        <a href="{{ url_for('main') }}">メインへ戻る</a>
      </div>
      <div class="settings-title">設定</div>

      <details class="settings-group" open>
        <summary>全般の設定</summary>
        <div class="details-body">
          <div class="field">
            <label for="font-family">字体</label>
            <select id="font-family">
              <option value="">システム標準</option>
              <option value="\"Yu Gothic\", \"Meiryo\", sans-serif">游ゴシック</option>
              <option value="\"Noto Sans JP\", sans-serif">Noto Sans JP</option>
              <option value="\"M PLUS 1\", sans-serif">M PLUS 1</option>
              <option value="\"Sawarabi Gothic\", sans-serif">Sawarabi Gothic</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
            </select>
          </div>
          <div class="field">
            <label for="color-template">カラーテンプレート</label>
            <select id="color-template">
              <option value="">テンプレートを選択</option>
              <option value="midnight">Midnight Blue</option>
              <option value="sunset">Sunset Orange</option>
              <option value="forest">Forest Green</option>
              <option value="mono">Mono Slate</option>
              <option value="neon">Neon Cyan</option>
            </select>
          </div>
          <div class="field">
            <label for="accent-color">標準アクセント色</label>
            <input id="accent-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="muted-color">標準のグレー色</label>
            <input id="muted-color" type="color" value="#cdd6df">
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>メイン画面の設定</summary>
        <div class="details-body">
          <div class="field">
            <label for="main-bg-color">背景色</label>
            <input id="main-bg-color" type="color" value="#0b1f38">
          </div>
          <div class="field">
            <label for="wake-word">呼びかけワード</label>
            <input id="wake-word" type="text" placeholder="(例:サイレントメイト)">
            <div class="hint">複数指定する場合は「,」区切りで入力してください。</div>
          </div>
          <div class="field">
            <label for="stripe-color">ストライプの色</label>
            <input id="stripe-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="main-button-color">ボタンの色</label>
            <input id="main-button-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="tone-input">口調の設定（入力確認）</label>
            <input id="tone-input" type="text" placeholder="(例:関西弁、英語等)">
          </div>
          <div class="field">
            <label for="tone-response">口調の設定（返答）</label>
            <input id="tone-response" type="text" placeholder="(例:関西弁、英語等)">
          </div>
          <div class="field">
            <label for="tone-error">口調の設定（エラーメッセージ）</label>
            <input id="tone-error" type="text" placeholder="(例:関西弁、英語等)">
            <div class="hint">空欄の場合は標準の口調で返答します。</div>
          </div>
          <div class="field">
            <label for="voice-select">喋っている声</label>
            <select id="voice-select">
              <option value="">自動（既定）</option>
            </select>
            <div class="hint">利用可能な音声が無い場合は既定を使用します。</div>
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>サイレントメイト君の設定</summary>
        <div class="details-body">
          <div class="field-inline">
            <input id="character-enabled" type="checkbox" checked>
            <label for="character-enabled">サイレントメイト君を表示する</label>
          </div>
          <div class="field">
            <label for="character-size">サイズ</label>
            <div class="field-inline">
              <input id="character-size" type="range" min="120" max="1000" step="2">
              <span id="character-size-value">220px</span>
            </div>
          </div>
          <div class="field">
            <label for="character-color">色</label>
            <input id="character-color" type="color" value="#B1D656">
            <div class="hint">初期色: RGB(177, 214, 86)</div>
          </div>
        </div>
      </details>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app_settings_apply.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
