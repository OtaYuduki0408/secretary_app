<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Secretary — 設定</title>
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    /* width fix */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }
    .settings-shell {
      width: 100%;
      box-sizing: border-box;
    }
    .settings-card {
      max-width: 100%;
      width: min(760px, 92vw);
      box-sizing: border-box;
    }
    .field input,
    .field select {
      max-width: 100%;
      box-sizing: border-box;
    }
    .field-inline {
      flex-wrap: wrap;
    }

    body {
      font-family: var(--app-font, inherit);
    }

    .settings-shell {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: clamp(18px, 4vw, 40px);
      gap: 18px;
    }

    .settings-card {
      width: min(760px, 92vw);
      background: rgba(10, 18, 28, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 18px;
      padding: clamp(18px, 4vw, 28px);
      color: #e2e8f0;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .settings-title {
      font-size: clamp(1.2rem, 2.4vw, 1.5rem);
      margin-bottom: 18px;
      font-weight: 700;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 18px;
    }

    .settings-actions a {
      color: #e2e8f0;
      text-decoration: none;
      border: 1px solid rgba(148, 163, 184, 0.5);
      border-radius: 999px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.6);
    }

    .settings-group {
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-group summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: rgba(30, 41, 59, 0.9);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-group summary::-webkit-details-marker {
      display: none;
    }

    .settings-group .details-body {
      padding: 16px;
      background: rgba(8, 15, 24, 0.7);
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 0.95rem;
      color: #cbd5f5;
    }

    .field input,
    .field select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
    }

    .field input[type="color"] {
      padding: 0;
      height: 42px;
      width: 96px;
      border: none;
      background: transparent;
    }

    .field-inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .field-inline input[type="range"] {
      flex: 1;
    }

    .hint {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .btn-primary {
        border: none;
        border-radius: 18px;
        padding: 8px 16px;
        font-size: 1rem;
        font-weight: 700;
        color: #0f172a;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        cursor: pointer;
        transition: .2s;
    }
    .btn-primary:hover {
        filter: brightness(1.05);
        box-shadow: 0 10px 25px rgba(14, 165, 233, .35);
    }
    .btn-primary:disabled {
        background: #555;
        cursor: not-allowed;
        filter: none;
        box-shadow: none;
    }
  </style>
</head>
<body>
  <script src="static/js/android_bridge.js"></script>
  <main class="settings-shell">
    <section class="settings-card">
      <div class="settings-actions">
        <a href="main.html">メインへ戻る</a>
      </div>

      <details class="settings-group" open>
  <summary>同期設定</summary>
  <div class="details-body">
    <div class="field">
      <label for="sync-conflict-policy">自動同期の優先</label>
      <select id="sync-conflict-policy">
        <option value="LOCAL_WINS">スマホ優先</option>
        <option value="SERVER_WINS">サーバー優先</option>
      </select>
    </div>
    <div class="field">
      <label for="sync-interval">自動同期の間隔</label>
      <select id="sync-interval">
        <option value="0">オフ</option>
        <option value="6">6時間ごと</option>
        <option value="12">12時間ごと</option>
        <option value="24">1日1回</option>
      </select>
      <div class="hint">例: 1日1回 / 推奨: 毎日</div>
    </div>
    <div class="field">
      <label for="sync-manual-policy">手動同期の優先</label>
      <div class="field-inline">
        <select id="sync-manual-policy">
          <option value="LOCAL_WINS">スマホ優先</option>
          <option value="SERVER_WINS">サーバー優先</option>
        </select>
        <button id="sync-now-btn" type="button" class="btn-primary">今すぐ同期</button>
      </div>
    </div>
    <div class="hint" id="sync-status">未同期</div>
  </div>
</details>

      <div class="settings-title">設定</div>

      <details class="settings-group" open>
        <summary>全般の設定</summary>
        <div class="details-body">
          <div class="field">
            <label for="font-family">字体</label>
            <select id="font-family">
              <option value="">システム標準</option>
              <option value="\"Yu Gothic\", \"Meiryo\", sans-serif">游ゴシック</option>
              <option value="\"Noto Sans JP\", sans-serif">Noto Sans JP</option>
              <option value="\"M PLUS 1\", sans-serif">M PLUS 1</option>
              <option value="\"Sawarabi Gothic\", sans-serif">Sawarabi Gothic</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
            </select>
          </div>
          <div class="field">
            <label for="color-template">カラーテンプレート</label>
            <select id="color-template">
              <option value="">テンプレートを選択</option>
              <option value="midnight">Midnight Blue</option>
              <option value="sunset">Sunset Orange</option>
              <option value="forest">Forest Green</option>
              <option value="mono">Mono Slate</option>
              <option value="neon">Neon Cyan</option>
            </select>
          </div>
          <div class="field">
            <label for="accent-color">標準アクセント色</label>
            <input id="accent-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="muted-color">標準のグレー色</label>
            <input id="muted-color" type="color" value="#cdd6df">
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>メイン画面の設定</summary>
        <div class="details-body">
          <div class="field">
            <label for="main-bg-color">背景色</label>
            <input id="main-bg-color" type="color" value="#0b1f38">
          </div>
          <div class="field">
            <label for="wake-word">呼びかけワード</label>
            <input id="wake-word" type="text" placeholder="(例:サイレントメイト)">
            <div class="hint">複数指定する場合は「,」区切りで入力してください。</div>
          </div>
          <div class="field">
            <label for="stripe-color">ストライプの色</label>
            <input id="stripe-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="main-button-color">ボタンの色</label>
            <input id="main-button-color" type="color" value="#7aa8ff">
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>声の設定</summary>
        <div class="details-body">
          <div class="field">
            <label>入力確認の設定</label>
            <div class="field-inline">
              <input id="input-confirm-enabled" type="checkbox" checked>
              <label for="input-confirm-enabled">入力確認を行う</label>
            </div>
          </div>
          <div class="field">
            <label for="input-confirm-template">入力確認テンプレート</label>
            <input id="input-confirm-template" type="text" value="でございますね。かしこまりました。">
            <div class="hint">入力文の後ろに追加されます。</div>
          </div>
          <div class="field">
            <label for="tone-response">口調の設定（返答）</label>
            <input id="tone-response" type="text" placeholder="(例:関西弁、英語等)">
          </div>
          <div class="field">
            <label for="tone-error">口調の設定（エラーメッセージ）</label>
            <input id="tone-error" type="text" placeholder="(例:関西弁、英語等)">
            <div class="hint">空欄の場合は標準の口調で返答します。</div>
          </div>
          <div class="field">
            <label for="voice-select">喋っている声</label>
            <select id="voice-select">
              <option value="">自動（既定）</option>
            </select>
            <div class="hint">利用可能な音声が無い場合は既定を使用します。</div>
          </div>
          <div class="field">
            <label for="voice-rate">話速</label>
            <div class="field-inline">
              <input id="voice-rate" type="range" min="0.5" max="2" step="0.1">
              <span id="voice-rate-value"></span>
            </div>
          </div>
          <div class="field">
            <label for="voice-pitch">ピッチ</label>
            <div class="field-inline">
              <input id="voice-pitch" type="range" min="0" max="2" step="0.1">
              <span id="voice-pitch-value"></span>
            </div>
          </div>
          <div class="field">
            <label for="voice-volume">音量</label>
            <div class="field-inline">
              <input id="voice-volume" type="range" min="0" max="1" step="0.1">
              <span id="voice-volume-value"></span>
            </div>
          </div>
          <div class="field">
            <label for="voice-test-text">テストテキスト</label>
            <input id="voice-test-text" type="text" value="この声でよろしいでしょうか？">
          </div>
          <div class="field">
            <button id="voice-test-button" type="button">テスト再生</button>
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>サイレントメイト君の設定</summary>
        <div class="details-body">
          <div class="field-inline">
            <input id="character-enabled" type="checkbox" checked>
            <label for="character-enabled">サイレントメイト君を表示する</label>
          </div>
          <div class="field">
            <label for="character-size">サイズ</label>
            <div class="field-inline">
              <input id="character-size" type="range" min="120" max="1000" step="2">
              <span id="character-size-value">220px</span>
            </div>
          </div>
          <div class="field">
            <label for="character-color">色</label>
            <input id="character-color" type="color" value="#B1D656">
            <div class="hint">初期色: RGB(177, 214, 86)</div>
          </div>
        </div>
      </details>
    </section>
  </main>

    <script src="static/js/app_settings_apply.js"></script>
  <script src="static/js/settings.js"></script>

  <script>
    (() => {
      const bridge = window.AndroidSync;
      if (!bridge) return;

      const conflictEl = document.getElementById('sync-conflict-policy');
      const intervalEl = document.getElementById('sync-interval');
      const manualEl = document.getElementById('sync-manual-policy');
      const syncBtn = document.getElementById('sync-now-btn');
      const statusEl = document.getElementById('sync-status');

      try {
        const raw = bridge.getSettingsJson?.();
        const settings = raw ? JSON.parse(raw) : null;
        if (settings?.conflictPolicy && conflictEl) conflictEl.value = settings.conflictPolicy;
        if (typeof settings?.intervalHours === 'number' && intervalEl) intervalEl.value = String(settings.intervalHours);
      } catch (e) {
        console.log('[sync-ui] failed to read settings', e);
      }

      conflictEl?.addEventListener('change', (e) => {
        bridge.setConflictPolicy?.(e.target.value);
      });
      intervalEl?.addEventListener('change', (e) => {
        bridge.setIntervalHours?.(parseInt(e.target.value || '0', 10));
      });
      syncBtn?.addEventListener('click', () => {
        if (syncBtn.disabled) return;

        const policy = manualEl?.value || 'LOCAL_WINS';
        
        syncBtn.disabled = true;
        statusEl.textContent = '同期中';
        let dotCount = 0;
        const intervalId = setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            statusEl.textContent = '同期中' + '.'.repeat(dotCount);
        }, 500);

        setTimeout(() => {
            try {
                const result = bridge.runSync?.(policy);
                const res = JSON.parse(result || '{}');
                
                clearInterval(intervalId);
                syncBtn.disabled = false;

                if (res.success) {
                    statusEl.textContent = "同期が完了しました。ページを再読み込みします。";
                    setTimeout(() => location.reload(), 1000);
                } else {
                    statusEl.textContent = "同期に失敗しました: " + (res.message || "不明なエラー");
                }
            } catch (e) {
                clearInterval(intervalId);
                syncBtn.disabled = false;
                statusEl.textContent = "同期処理の呼び出しに失敗しました: " + e.message;
            }
        }, 10); // Allow UI to update before blocking
      });
    })();
  </script>

</body>
</html>
