<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Secretary - 設定</title>
  <link rel="stylesheet" href="./static/css/style.css">
  <style>
    body {
      font-family: var(--app-font, inherit);
    }

    .settings-shell {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: clamp(18px, 4vw, 40px);
      gap: 18px;
    }

    .settings-card {
      width: min(760px, 92vw);
      background: color-mix(in srgb, var(--app-panel, #0a121c) 80%, transparent);
      border: 1px solid rgba(var(--app-border-rgb, 148, 163, 184), 0.35);
      border-radius: 18px;
      padding: clamp(18px, 4vw, 28px);
      color: var(--app-text, #e2e8f0);
      box-shadow: var(--app-shadow, 0 18px 40px rgba(0, 0, 0, 0.35));
      backdrop-filter: blur(10px);
    }

    .settings-title {
      font-size: clamp(1.2rem, 2.4vw, 1.5rem);
      margin-bottom: 18px;
      font-weight: 700;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 18px;
    }

    .settings-actions a {
      color: var(--app-text, #e2e8f0);
      text-decoration: none;
      border: 1px solid rgba(var(--app-border-rgb, 148, 163, 184), 0.5);
      border-radius: 999px;
      padding: 8px 16px;
      background: color-mix(in srgb, var(--app-panel, #0f172a) 70%, transparent);
    }

    .settings-group {
      border: 1px solid rgba(var(--app-border-rgb, 148, 163, 184), 0.25);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-group summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      background: color-mix(in srgb, var(--app-panel-soft, #1e293b) 85%, transparent);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-group summary::-webkit-details-marker {
      display: none;
    }

    .settings-group .details-body {
      padding: 16px;
      background: color-mix(in srgb, var(--app-panel, #0b1220) 75%, transparent);
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 0.95rem;
      color: var(--app-muted, #cbd5f5);
    }

    .field input,
    .field select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--app-input-border, rgba(148, 163, 184, 0.35));
      background: var(--app-input-bg, rgba(15, 23, 42, 0.7));
      color: var(--app-input-text, #e2e8f0);
    }

    .field input[type="color"] {
      padding: 0;
      height: 42px;
      width: 96px;
      border: none;
      background: transparent;
    }

    .field-inline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s ease;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--app-button-bg, #38bdf8), var(--app-accent-strong, #0ea5e9));
      color: var(--app-button-text, #0f172a);
      box-shadow: 0 10px 25px rgba(var(--app-accent-rgb, 56, 189, 248), 0.3);
    }

    .settings-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px rgba(var(--app-accent-rgb, 56, 189, 248), 0.4);
    }

    .field-inline input[type="range"] {
      flex: 1;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--app-muted, #94a3b8);
    }
  </style>
</head>
<body>
  <main class="settings-shell">
    <section class="settings-card">
      <div class="settings-actions">
        <a href="main.html">メインに戻る</a>
      </div>
      <div class="settings-title">設定</div>

      <details class="settings-group">
        <summary>全般の設定</summary>
        <div class="details-body">
          <div class="field">
            <label for="font-family">字体</label>
            <input id="font-family" type="text" placeholder="(例: 'Noto Sans JP', 'Yu Gothic')">
          </div>
          <div class="field">
            <label for="color-template">カラーテンプレート</label>
            <select id="color-template">
              <option value="">選択しない</option>
              <option value="theme01">01: 霧夜ブルー</option>
              <option value="theme02">02: 深海ネイビー</option>
              <option value="theme03">03: 墨ブラック</option>
              <option value="theme04">04: スチールグレー</option>
              <option value="theme05">05: 夕焼けアンバー</option>
              <option value="theme06">06: 焦がしオレンジ</option>
              <option value="theme07">07: 苺ミルク</option>
              <option value="theme08">08: 梅紫</option>
              <option value="theme09">09: 夜桜パープル</option>
              <option value="theme10">10: ライムグリーン</option>
              <option value="theme11">11: 深緑フォレスト</option>
              <option value="theme12">12: 抹茶</option>
              <option value="theme13">13: 砂漠サンド</option>
              <option value="theme14">14: コーヒーブラウン</option>
              <option value="theme15">15: ミントソーダ</option>
              <option value="theme16">16: アイスブルー</option>
              <option value="theme17">17: サイバーシアン</option>
              <option value="theme18">18: レモンイエロー</option>
              <option value="theme19">19: ローズピンク</option>
              <option value="theme20">20: ロイヤルブルー</option>
              <option value="theme21">21: ベージュクリーム</option>
              <option value="theme22">22: モノクロ（高コントラスト）</option>
              <option value="theme23">23: ダークレッド</option>
              <option value="theme24">24: ダークティール</option>
            </select>
            <div class="hint">テンプレートを選ぶと各色が一括で反映されます。</div>
          </div>
          <div class="field">
            <label for="theme-save-name">ユーザーテーマ名</label>
            <input id="theme-save-name" type="text" placeholder="(例: 自分好みの青)">
            <div class="hint">現在の色設定を名前付きで保存します。</div>
          </div>
          <div class="field-inline">
            <button id="theme-save-button" class="settings-button" type="button">この色セットを保存</button>
            <button id="theme-delete-button" class="settings-button" type="button">選択中のユーザーテーマを削除</button>
          </div>
          <div class="field">
            <label for="accent-color">アクセント色</label>
            <input id="accent-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="muted-color">標準グレー色</label>
            <input id="muted-color" type="color" value="#cdd6df">
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>全画面共通の色</summary>
        <div class="details-body">
          <div class="field">
            <label for="ui-bg-color">背景色</label>
            <input id="ui-bg-color" type="color" value="#0f172a">
          </div>
          <div class="field">
            <label for="ui-panel-color">パネル背景色</label>
            <input id="ui-panel-color" type="color" value="#1e293b">
          </div>
          <div class="field">
            <label for="ui-panel-soft-color">パネル背景色(淡)</label>
            <input id="ui-panel-soft-color" type="color" value="#243045">
          </div>
          <div class="field">
            <label for="ui-text-color">文字色</label>
            <input id="ui-text-color" type="color" value="#f8fafc">
          </div>
          <div class="field">
            <label for="ui-muted-color">補助文字色</label>
            <input id="ui-muted-color" type="color" value="#cbd5f5">
          </div>
          <div class="field">
            <label for="ui-accent-color">アクセント色</label>
            <input id="ui-accent-color" type="color" value="#38bdf8">
          </div>
          <div class="field">
            <label for="ui-accent-strong-color">アクセント色(濃)</label>
            <input id="ui-accent-strong-color" type="color" value="#0ea5e9">
          </div>
          <div class="field">
            <label for="ui-border-color">境界線の色</label>
            <input id="ui-border-color" type="color" value="#94a3b8">
          </div>
          <div class="field">
            <label for="ui-success-color">成功色</label>
            <input id="ui-success-color" type="color" value="#34d399">
          </div>
          <div class="field">
            <label for="ui-danger-color">警告色</label>
            <input id="ui-danger-color" type="color" value="#f87171">
          </div>
          <div class="field">
            <label for="ui-input-bg-color">入力欄の背景色</label>
            <input id="ui-input-bg-color" type="color" value="#0f172a">
          </div>
          <div class="field">
            <label for="ui-input-text-color">入力欄の文字色</label>
            <input id="ui-input-text-color" type="color" value="#f8fafc">
          </div>
          <div class="field">
            <label for="ui-input-border-color">入力欄の境界線</label>
            <input id="ui-input-border-color" type="color" value="#94a3b8">
          </div>
          <div class="field">
            <label for="ui-button-bg-color">ボタン背景色</label>
            <input id="ui-button-bg-color" type="color" value="#38bdf8">
          </div>
          <div class="field">
            <label for="ui-button-text-color">ボタン文字色</label>
            <input id="ui-button-text-color" type="color" value="#0f172a">
          </div>
          <div class="field">
            <label for="ui-link-color">リンク色</label>
            <input id="ui-link-color" type="color" value="#38bdf8">
          </div>
          <div class="field">
            <label for="ui-shadow-color">影の色</label>
            <input id="ui-shadow-color" type="color" value="#0f172a">
            <div class="hint">影は設定色に透明度を加えて描画します。</div>
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>メイン画面の設定</summary>
        <div class="details-body">
          <div class="field">
            <label for="wake-word">呼びかけワード</label>
            <input id="wake-word" type="text" placeholder="(例: サイレントメイト君)" />
            <div class="hint">複数入力する場合はカンマ区切りで入力してください。</div>
          </div>
          <div class="field">
            <label for="main-bg-color">背景色(ストライプの裏)</label>
            <input id="main-bg-color" type="color" value="#0b1f38">
          </div>
          <div class="field">
            <label for="stripe-color">ストライプの色</label>
            <input id="stripe-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="main-button-color">ボタンの色</label>
            <input id="main-button-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="mic-color">音声認識ボタンの色</label>
            <input id="mic-color" type="color" value="#2a3440">
          </div>
          <div class="field">
            <label for="user-badge-bg-color">ログイン表示の背景色</label>
            <input id="user-badge-bg-color" type="color" value="#f1f5f9">
          </div>
          <div class="field">
            <label for="log-bg-color">ログ表示の背景色</label>
            <input id="log-bg-color" type="color" value="#ffffff">
          </div>
          <div class="field">
            <label for="fab-color">各機能ボタンのテーマ色</label>
            <input id="fab-color" type="color" value="#7aa8ff">
          </div>
          <div class="field">
            <label for="main-text-color">文字色</label>
            <input id="main-text-color" type="color" value="#0f1720">
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>声の設定</summary>
        <div class="details-body">
          <div class="field">
            <label>入力確認の設定</label>
            <div class="field-inline">
              <input id="input-confirm-enabled" type="checkbox" checked>
              <label for="input-confirm-enabled">入力確認を行う</label>
            </div>
          </div>
          <div class="field">
            <label for="input-confirm-template">入力確認テンプレート</label>
            <input id="input-confirm-template" type="text" value="だね、ちょっと待ってね！">
            <div class="hint">入力確認時の読み上げに使用されます。</div>
          </div>
          <div class="field">
            <label for="tone-response">口調の設定(返答)</label>
            <input id="tone-response" type="text" placeholder="(例: 関西弁、英語等)">
          </div>
          <div class="field">
            <label for="tone-error">口調の設定(エラーメッセージ)</label>
            <input id="tone-error" type="text" placeholder="(例: 関西弁、英語等)">
            <div class="hint">空欄の場合は標準の口調で返答します。</div>
          </div>
          <div class="field">
            <label for="voice-select">喋っている声</label>
            <select id="voice-select">
              <option value="">既定を使用</option>
            </select>
            <div class="hint">利用可能な音声が無い場合は既定を使用します。</div>
          </div>
          <div class="field">
            <label for="voice-rate">話速</label>
            <div class="field-inline">
              <input id="voice-rate" type="range" min="0.5" max="2" step="0.1">
              <span id="voice-rate-value"></span>
            </div>
          </div>
          <div class="field">
            <label for="voice-pitch">ピッチ</label>
            <div class="field-inline">
              <input id="voice-pitch" type="range" min="0" max="2" step="0.1">
              <span id="voice-pitch-value"></span>
            </div>
          </div>
          <div class="field">
            <label for="voice-volume">音量</label>
            <div class="field-inline">
              <input id="voice-volume" type="range" min="0" max="1" step="0.1">
              <span id="voice-volume-value"></span>
            </div>
          </div>
          <div class="field">
            <label for="voice-test-text">テストテキスト</label>
            <input id="voice-test-text" type="text" value="僕はサイレントメイト君だよ">
          </div>
          <div class="field">
            <button id="voice-test-button" type="button">テスト再生</button>
          </div>
        </div>
      </details>

      <details class="settings-group">
        <summary>サイレントメイト君の設定</summary>
        <div class="details-body">
          <div class="field-inline">
            <input id="character-enabled" type="checkbox" checked>
            <label for="character-enabled">サイレントメイト君を表示する</label>
          </div>
          <div class="field">
            <label for="character-size">サイズ</label>
            <div class="field-inline">
              <input id="character-size" type="range" min="120" max="1000" step="2">
              <span id="character-size-value">220px</span>
            </div>
          </div>
          <div class="field">
            <label for="character-color">色</label>
            <input id="character-color" type="color" value="#B1D656">
            <div class="hint">既定色: RGB(177, 214, 86)</div>
          </div>
        </div>
      </details>
    </section>
  </main>

  <script src="./static/js/app_settings_apply.js"></script>
  <script src="./static/js/settings.js"></script>
</body>
</html>
