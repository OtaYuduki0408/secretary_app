<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voice Secretary — Main</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    .bg-sentinel{position:fixed;inset:0;z-index:0;background:var(--wallpaper);background-color:var(--bg-1);}
    /* background fix */
    html, body {
      min-height: 100svh;
      background: var(--wallpaper);
      background-color: var(--bg-1);
      background-attachment: fixed;
    }
    body {
      min-height: 100svh;
    }
    .shell {
      min-height: 100svh;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .modal-content {
      background: #1f2a33;
      padding: 20px;
      border-radius: 10px;
      position: relative;
      text-align: center;
      border: 1px solid #a8b6c6;
    }

    .modal-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #a8b6c6;
      cursor: pointer;
    }

    .switchbot-controls {
      margin-top: 20px;
    }

    .switchbot-controls .btn {
      margin: 0 10px;
      /* Assuming .btn class exists and has base styling */
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      background-color: #7aa8ff;
      color: #1f2a33;
      border: 1px solid #a8b6c6;
    }

    .user-badge {
      margin: 12px auto 0;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(28,35,42,0.85); /* Match panel */
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      width: min(50vw, 320px);
      max-width: 50vw;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .user-name {
      font-weight: 600;
      color: var(--accent);
    }

    /* New Terminal UI Styles */
    .ui-stack {
      gap: 24px;
    }

    .terminal-window {
      width: min(700px, 100%);
      max-width: 100%;
      min-height: 320px;
      height: min(420px, 65vh);
      margin: 0 auto clamp(18px, 3vh, 26px);
      border-radius: 16px;
      background: rgba(28,35,42,0.85); /* Match panel */
      border: 1px solid #d1d5db; /* Gray border */
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .voice-log-panel {
      flex-grow: 1;
      padding: clamp(16px, 3vw, 24px);
      overflow-y: auto;
      color: var(--text);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 1rem;
      line-height: 1.7;
    }

    .log-interim {
        color: var(--muted);
    }

    .voice-log-panel::-webkit-scrollbar {
      width: 8px;
    }
    .voice-log-panel::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.08);
    }
    .voice-log-panel::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.18);
      border-radius: 4px;
    }

    .voice-log-entry {
      opacity: 1;
    }
    .voice-log-entry + .voice-log-entry {
        margin-top: 12px;
    }

    .search {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      width: min(960px, 92vw);
      padding: 16px clamp(22px, 4vw, 30px);
      margin: 0 auto;
      box-sizing: border-box;
      background: rgba(8,12,18,0.55);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.45);
    }
    
    .search .icon {
      stroke: #64748b; /* Icon color */
      margin-right: 0;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      align-self: center;
    }

    .search input {
      flex-grow: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #000000;
      font-size: 1.05rem;
      font-family: 'Consolas', 'Monaco', monospace;
    }

    .search input::placeholder {
      color: #9ca3af;
    }

    .highlight-wake-word {
      color: #D97706; /* Darker, rich yellow/orange */
      font-weight: 600;
      background-color: #FEF3C7; /* Light yellow background */
      padding: 2px 4px;
      border-radius: 4px;
    }

    .abort-row {
      margin-bottom: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .abort-btn {
      border: 1px solid rgba(255, 84, 84, 0.9);
      background: rgba(255, 34, 34, 0.22);
      color: #ffe6e6;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, opacity 0.12s ease;
      text-transform: uppercase;
    }

    .abort-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 60, 60, 0.35);
      background: rgba(255, 40, 40, 0.35);
    }

    .abort-btn:disabled {
      cursor: not-allowed;
      box-shadow: none;
    }

    .abort-btn.is-active {
      box-shadow: 0 12px 26px rgba(255, 60, 60, 0.5);
      background: rgba(255, 24, 24, 0.7);
      border-color: rgba(255, 140, 140, 0.95);
      color: #fff;
    }

    body {
      font-family: var(--app-font, inherit);
    }

    .character-buddy {
      position: fixed;
      left: 24px;
      bottom: 24px;
      width: min(var(--character-size, 220px), 32vw);
      z-index: 1200;
      pointer-events: none;
      filter: var(--character-filter, none);
    }

    .character-buddy img {
      width: 100%;
      height: auto;
      display: none;
    }

    .character-buddy img.active {
      display: block;
    }

    @media (max-width: 768px) {
      body {
        font-size: 15px; /* Adjust base font size for smaller screens */
      }

      main.shell {
        padding: clamp(16px, 4vw, 24px); /* Reduce overall padding */
      }

      .user-badge {
        font-size: 0.85rem;
        padding: 6px 12px;
        width: 100%;
        justify-content: center;
      }

      .terminal-window {
        min-height: clamp(260px, 60vh, 360px);
        height: auto;
      }

      .voice-log-panel {
        font-size: 0.9rem;
        padding: 14px;
        line-height: 1.6;
      }

    .search {
      grid-template-columns: 1fr;
      width: 100%;
      margin: 0;
      padding: 12px;
      border-radius: 20px;
    }

      .search input {
        font-size: 1rem;
      }

      .mic-wrap .mic-btn {
        width: min(110px, 30vw);
        height: min(110px, 30vw);
      }

    .fab-group {
      position: static;
      display: flex;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
      gap: 16px;
      justify-items: center;
    }

    .fab, .fab svg {
      width: 62px;
      height: 62px;
      opacity: 1 !important;
    }

    .character-buddy {
      left: 12px;
      bottom: 12px;
      width: min(var(--character-size, 160px), 38vw);
    }
    }

    @media (max-width: 480px) {
      .terminal-window {
        min-height: clamp(240px, 55vh, 320px);
      }

      .voice-log-panel {
        font-size: 0.85rem;
        padding: 12px;
      }

      .search {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .fab, .fab svg {
        width: 48px;
        height: 48px;
      }

      .character-buddy {
        width: min(140px, 44vw);
      }
    }
  </style>

// AIインジケータ制御スクリプト (両方に存在)
(() => {
  const box   = document.getElementById('ai-indicator');
  const title = document.getElementById('aii-title');
  const label = document.getElementById('aii-label');
  const bars  = Array.from(document.querySelectorAll('#aii-steps span'));
  let steps = ['目的判定','詳細抽出','結果反映'];
 
  function setActive(n){
    bars.forEach((b,i)=> b.style.background = i < n ? '#93c5fd' : '#475569');
    bars.forEach((b,i)=> b.style.opacity = i < n ? '1' : '.45');
    label.textContent = steps[Math.max(0, Math.min(n-1, steps.length-1))] || '処理中';
  }
 
  document.addEventListener('analysis:start', (e)=>{
    steps = e.detail?.steps || steps;
    title.textContent = '解析中…';
    label.textContent = '準備中';
    setActive(0);
    box.style.display = 'block';
  });
 
  document.addEventListener('analysis:step', (e)=>{
    const idx = (e.detail?.index|0);
    if (e.detail?.label) steps[idx-1] = e.detail.label;
    setActive(idx);
  });
 
  document.addEventListener('analysis:end', ()=>{
    setActive(steps.length);
    title.textContent = '完了';
    setTimeout(()=> box.style.display = 'none', 700);
  });
})();
</script>

<script>
  (() => {
    const body = document.body;
    const root = document.documentElement;
    const character = document.getElementById('character-buddy');

    const hexToRgb = (hex) => {
      const raw = hex.replace('#', '');
      const full = raw.length === 3 ? raw.split('').map((c) => c + c).join('') : raw;
      const num = parseInt(full, 16);
      if (Number.isNaN(num)) return { r: 177, g: 214, b: 86 };
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    };

    const rgbToHsl = (r, g, b) => {
      r /= 255;
      g /= 255;
      b /= 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      let h = 0;
      let s = 0;
      const l = (max + min) / 2;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          default:
            h = (r - g) / d + 4;
        }
        h /= 6;
      }
      return { h: h * 360, s, l };
    };

    const baseColor = { r: 177, g: 214, b: 86 };
    const baseHsl = rgbToHsl(baseColor.r, baseColor.g, baseColor.b);

    const buildColorFilter = (hex) => {
      const target = hexToRgb(hex);
      const targetHsl = rgbToHsl(target.r, target.g, target.b);
      const hueRotate = targetHsl.h - baseHsl.h;
      const saturate = baseHsl.s > 0 ? targetHsl.s / baseHsl.s : 1;
      const brightness = baseHsl.l > 0 ? targetHsl.l / baseHsl.l : 1;
      return `hue-rotate(${hueRotate.toFixed(1)}deg) saturate(${saturate.toFixed(2)}) brightness(${brightness.toFixed(2)})`;
    };

    const applySettings = () => {
      let settings = null;
      try {
        const raw = localStorage.getItem('appSettings');
        settings = raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.warn('設定の読み込みに失敗しました。', e);
      }

      const general = settings?.general || {};
      const main = settings?.main || {};
      const characterSettings = settings?.character || { enabled: false };

      if (general.fontFamily) {
        root.style.setProperty('--app-font', general.fontFamily);
      } else {
        root.style.removeProperty('--app-font');
      }

      const clamp = (value) => Math.min(255, Math.max(0, Math.round(value)));
      const scale = (value, factor) => clamp(value * factor);
      if (main.backgroundColor) {
        const color = hexToRgb(main.backgroundColor);
        const dark = `rgb(${scale(color.r, 0.55)}, ${scale(color.g, 0.55)}, ${scale(color.b, 0.55)})`;
        const mid = `rgb(${scale(color.r, 0.78)}, ${scale(color.g, 0.78)}, ${scale(color.b, 0.78)})`;
        const glow1 = `rgba(${color.r}, ${color.g}, ${color.b}, 0.18)`;
        const glow2 = `rgba(${color.r}, ${color.g}, ${color.b}, 0.12)`;
        root.style.setProperty('--bg-1', dark);
        root.style.setProperty('--bg-2', mid);
        root.style.setProperty('--wallpaper', `radial-gradient(circle at 18% 22%, ${glow1}, transparent 45%), radial-gradient(circle at 70% 10%, ${glow2}, transparent 55%), linear-gradient(180deg, ${mid} 0%, ${dark} 100%)`);
        root.style.setProperty('--wallpaper-darken', 'rgba(6,12,32,.18)');
      } else {
        root.style.removeProperty('--bg-1');
        root.style.removeProperty('--bg-2');
        root.style.removeProperty('--wallpaper');
        root.style.removeProperty('--wallpaper-darken');
      }

      if (main.stripeColor) {
        const stripe = hexToRgb(main.stripeColor);
        root.style.setProperty('--stripe-color', `rgba(${stripe.r}, ${stripe.g}, ${stripe.b}, 0.35)`);
      } else {
        root.style.removeProperty('--stripe-color');
      }

      if (main.buttonColor) {
        const btn = hexToRgb(main.buttonColor);
        root.style.setProperty('--main-btn-color', `rgb(${btn.r}, ${btn.g}, ${btn.b})`);
      } else {
        root.style.removeProperty('--main-btn-color');
      }

      const sizeValue = characterSettings.size || 220;
      root.style.setProperty('--character-size', `${sizeValue}px`);

      const colorValue = characterSettings.color || '#B1D656';
      root.style.setProperty('--character-filter', buildColorFilter(colorValue));

      if (character) {
        const isEnabled = characterSettings.enabled === true;
        character.style.display = isEnabled ? 'block' : 'none';
      }
    };

    applySettings();
    window.addEventListener('storage', applySettings);
  })();
</script>
<script>
  (() => {
    const idleFrame = document.getElementById('character-frame-idle');
    const frameA = document.getElementById('character-frame-1');
    const frameB = document.getElementById('character-frame-2');
    if (!idleFrame || !frameA || !frameB) return;

    const talkFrames = [frameA, frameB];
    let talkIndex = 0;
    let timerId = null;

    const showFrame = (index) => {
      idleFrame.classList.toggle('active', index === 'idle');
      talkFrames.forEach((frame, i) => frame.classList.toggle('active', index === i));
    };

    const startTalking = () => {
      if (timerId) return;
      let idx = talkIndex;
      timerId = setInterval(() => {
        idx = idx === 0 ? 1 : 0;
        showFrame(idx);
        talkIndex = idx;
      }, 220);
    };

    const stopTalking = () => {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      showFrame('idle');
    };

    showFrame('idle');
    document.addEventListener('voice:playstart', startTalking);
    document.addEventListener('voice:playend', stopTalking);
  })();
</script>
<script>
  (() => {
    const log = (...args) => console.log('[DEBUG:CSS]', ...args);
    const warn = (...args) => console.warn('[DEBUG:CSS]', ...args);

    // CSS/JS???????????????????????
    function findResourceEntry(keyword) {
      const entries = performance.getEntriesByType('resource');
      return entries.find((entry) => entry.name.includes(keyword));
    }

    function dumpResourceEntry(keyword) {
      const entry = findResourceEntry(keyword);
      if (!entry) {
        warn(`resource not found: ${keyword}`);
        return;
      }
      log(`resource: ${keyword}`, {
        name: entry.name,
        initiatorType: entry.initiatorType,
        transferSize: entry.transferSize,
        encodedBodySize: entry.encodedBodySize,
        decodedBodySize: entry.decodedBodySize,
      });
    }

    function dumpStyleSnapshot() {
      const rootStyle = getComputedStyle(document.documentElement);
      const bodyStyle = getComputedStyle(document.body);
      log('env', {
        time: new Date().toISOString(),
        location: location.href,
        origin: location.origin,
        userAgent: navigator.userAgent,
        language: navigator.language,
        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        devicePixelRatio: window.devicePixelRatio,
        styleSheetCount: document.styleSheets.length,
      });
      log('theme', {
        vsThemeIdx: localStorage.getItem('vs_theme_idx'),
        htmlClass: document.documentElement.className,
      });
      log('css-vars', {
        bg1: rootStyle.getPropertyValue('--bg-1').trim(),
        bg2: rootStyle.getPropertyValue('--bg-2').trim(),
        accent: rootStyle.getPropertyValue('--accent').trim(),
        wallpaper: rootStyle.getPropertyValue('--wallpaper').trim(),
      });
      log('body-background', {
        backgroundImage: bodyStyle.backgroundImage,
        backgroundColor: bodyStyle.backgroundColor,
      });

      const styleLink = document.querySelector('link[rel="stylesheet"][href*="style.css"]');
      if (styleLink) {
        log('style.css link', styleLink.href);
      } else {
        warn('style.css link not found');
      }

      const sheets = Array.from(document.styleSheets).map((sheet) => sheet.href || 'inline');
      log('stylesheets', sheets);

      dumpResourceEntry('style.css');
      dumpResourceEntry('websocket_handler.js');
      dumpResourceEntry('Parallax_and_Theme_rotation.js');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', dumpStyleSnapshot);
    } else {
      dumpStyleSnapshot();
    }
  })();
</script>
