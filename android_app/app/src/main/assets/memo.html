<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メモ</title>
  <link rel="stylesheet" href="static/css/memo.css">
  <style>
    .memo.editing {
      background-color: #f0f8ff; /* Light blue background for editing state */
    }
    .edit-title-input,
    .edit-content-textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .edit-controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body class="memo-page">
  <script src=\"static/js/android_bridge.js\"></script>
  <div class="memo-shell">
    <header class="memo-page-header">
      <h1>メモ</h1>
      <div class="memo-header-actions">
        <a href="main.html" class="pill-btn">メインへ戻る</a>
      </div>
    </header>

    <section class="memo-card">
      <h2>メモを追加</h2>
      <input id="title" type="text" placeholder="タイトル" />
      <textarea id="content" rows="4" placeholder="本文を入力"></textarea>
      <div class="add-options">
        <div class="add-option-group">
          <input type="checkbox" id="add-is-pinned">
          <label for="add-is-pinned">ピン留めする</label>
        </div>
        <div class="add-option-group">
          <label for="add-priority">優先度</label>
          <input type="number" id="add-priority" placeholder="1, 2, 3...">
        </div>
      </div>
      <button id="add-memo-btn" class="primary-btn">追加</button>
    </section>

    <section class="memo-card">
      <h2>検索・フィルター</h2>
      <div class="search-bar">
        <input id="search" type="text" placeholder="キーワード検索" />
        <button id="search-btn" class="ghost-btn">検索</button>
      </div>
      <div class="filter-options">
        <div class="filter-group">
          <label for="search-type">検索対象</label>
          <select id="search-type">
            <option value="all" selected>全て</option>
            <option value="title">タイトル</option>
            <option value="content">本文</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="start-date">開始日</label>
          <input type="date" id="start-date">
        </div>
        <div class="filter-group">
          <label for="end-date">終了日</label>
          <input type="date" id="end-date">
        </div>
      </div>
    </section>

    <section class="memo-card memo-list-card">
      <div class="list-header">
        <h2>メモ一覧</h2>
        <button id="bulk-delete-toggle-btn" class="ghost-btn">選択モード</button>
      </div>
      <div id="memo-list" class="memo-list"></div>
    </section>
  </div>

  <div id="bulk-delete-actions" class="bulk-actions-footer" hidden>
    <button id="bulk-deselect-btn" class="ghost-btn">選択解除</button>
    <button id="bulk-delete-btn" class="danger-btn">選択したメモを削除</button>
    <button id="bulk-cancel-btn" class="secondary-btn">キャンセル</button>
  </div>

  <script>
    const API_URL_BASE = "/api/memos";
    let isBulkDeleteMode = false;

    async function localApiRequest(method, url, body = null) {
        console.log(`[localApiRequest] ${method} ${url}`, body);
        if (!window.AndroidSync?.request) {
            console.error("AndroidSync.request is not available");
            throw new Error("AndroidSync bridge not found");
        }
        const rawResponse = await window.AndroidSync.request(method, url, body ? JSON.stringify(body) : null);
        console.log(`[localApiRequest] Raw response for ${url}:`, rawResponse);
        const response = JSON.parse(rawResponse);
        if (response.status >= 400) {
            throw new Error(`API Error: ${response.status} ${response.body?.error}`);
        }
        return response.body;
    }

    const focusRestoreState = {
      plan: null,
      depth: 0
    };

    const getDefaultScrollContainer = () => document.scrollingElement || document.documentElement;

    // 再描画後に元の位置へスクロールを補正するためにスクロール親を特定
    const getScrollParent = (element) => {
      if (!element) return getDefaultScrollContainer();
      let parent = element.parentElement;
      while (parent) {
        const style = window.getComputedStyle(parent);
        const overflowY = style ? style.overflowY : "";
        if ((overflowY === "auto" || overflowY === "scroll" || overflowY === "overlay") && parent.scrollHeight > parent.clientHeight) {
          return parent;
        }
        parent = parent.parentElement;
      }
      return getDefaultScrollContainer();
    };

    const scheduleFocusRestore = (memoId, targetClass, rectSnapshot) => {
      focusRestoreState.plan = {
        memoId,
        targetClass,
        rectTop: rectSnapshot ? rectSnapshot.top : null,
        scrollContainer: (rectSnapshot && rectSnapshot.scrollContainer) || getDefaultScrollContainer()
      };
      focusRestoreState.depth += 1;
    };

    const cancelFocusRestore = () => {
      if (focusRestoreState.depth > 0) {
        focusRestoreState.depth -= 1;
      }
      if (focusRestoreState.depth === 0) {
        focusRestoreState.plan = null;
      }
    };

    const applyFocusRestorePlan = () => {
      const focusPlan = focusRestoreState.plan;
      focusRestoreState.plan = null;
      if (!focusPlan) return;
      const asyncCall = window.requestAnimationFrame || ((cb) => setTimeout(cb, 0));
      asyncCall(() => {
        const memoNode = document.getElementById(`memo-${focusPlan.memoId}`);
        if (!memoNode) return;
        if (typeof focusPlan.rectTop === "number" && focusPlan.scrollContainer) {
          const updatedRect = memoNode.getBoundingClientRect();
          const deltaY = updatedRect.top - focusPlan.rectTop;
          if (Math.abs(deltaY) > 1) {
            const container = focusPlan.scrollContainer;
            const isWindowScroll =
              container === document.body ||
              container === document.documentElement ||
              container === document.scrollingElement;
            if (isWindowScroll) {
              window.scrollBy({ top: deltaY });
            } else {
              container.scrollTop += deltaY;
            }
          }
        }
        if (focusPlan.targetClass) {
          const focusTarget = memoNode.querySelector(`.${focusPlan.targetClass}`);
          if (focusTarget) focusTarget.focus();
        }
      });
    };

    const resolveFocusRestoreAfterRender = () => {
      if (focusRestoreState.depth === 0) return;
      focusRestoreState.depth -= 1;
      if (focusRestoreState.depth === 0) {
        applyFocusRestorePlan();
      }
    };

    async function fetchMemos(params = {}) {
      const {
        keyword = "",
        searchType = "all",
        startDate = "",
        endDate = ""
      } = params;

      const query = new URLSearchParams({
        q: keyword,
        type: searchType,
        start: startDate,
        end: endDate
      });

      const list = document.getElementById("memo-list");
      list.innerHTML = '<p class="memo-placeholder">読み込み中...</p>';

      try {
        const memos = await localApiRequest("GET", `${API_URL_BASE}?${query.toString()}`);
        if (!Array.isArray(memos) || memos.length === 0) {
          list.innerHTML = '<p class="memo-placeholder">該当するメモがありません。</p>';
          return;
        }

        list.innerHTML = "";
        memos.forEach((memo) => list.appendChild(createMemoElement(memo)));
      } catch (err) {
        console.error(err);
        list.innerHTML = '<p class="memo-placeholder error">メモの読み込みに失敗しました。</p>';
      } finally {
        resolveFocusRestoreAfterRender();
      }
    }

    function createMemoElement(memo) {
      const wrapper = document.createElement("div");
      wrapper.className = "memo";
      wrapper.id = `memo-${memo.id}`;

      if (memo.is_pinned) wrapper.classList.add("pinned");

      const priorityValue = Number(memo.priority);
      if (!Number.isNaN(priorityValue)) {
        wrapper.classList.add(priorityValue >= 6 ? "priority-high" : `priority-${priorityValue}`);
      }

      const header = document.createElement("div");
      header.className = "memo-item-header";

      const title = document.createElement("strong");
      title.textContent = memo.title || "無題のメモ";
      header.appendChild(title);

      const controls = document.createElement("div");
      controls.className = "memo-controls";

      // 優先度入力
      const priorityInput = document.createElement("input");
      priorityInput.type = "number";
      priorityInput.min = "0";
      priorityInput.className = "priority-input";
      priorityInput.value = memo.priority ?? "";
      priorityInput.placeholder = "優先度";
      priorityInput.title = "優先度（ピン留め時のみ有効）";

      const captureMemoRect = () => {
        const memoEl = document.getElementById(`memo-${memo.id}`);
        if (!memoEl) return null;
        const rect = memoEl.getBoundingClientRect();
        return {
          top: rect.top,
          scrollContainer: getScrollParent(memoEl)
        };
      };

      const commitPriorityChange = (activeElementClass) => {
        scheduleFocusRestore(memo.id, activeElementClass, captureMemoRect());
        const maybePromise = updateMemo(memo.id, { priority: priorityInput.value, is_pinned: true });
        if (maybePromise && typeof maybePromise.then === "function") {
          maybePromise.then((success) => {
            if (!success) cancelFocusRestore();
          }).catch((err) => {
            console.error(err);
            cancelFocusRestore();
          });
        } else {
          cancelFocusRestore();
        }
      };

      priorityInput.addEventListener("change", () => {
        const value = Math.max(0, Number(priorityInput.value) || 0);
        priorityInput.value = value;
        commitPriorityChange("priority-input");
      });

      const priorityWrap = document.createElement("div");
      priorityWrap.className = "priority-input-wrap";
      priorityWrap.appendChild(priorityInput);

      const priorityArrows = document.createElement("div");
      priorityArrows.className = "priority-arrows";

      const changePriorityBy = (delta, targetClass) => {
        let current = Number(priorityInput.value);
        if (Number.isNaN(current)) current = 0;
        current = Math.max(0, current + delta);
        priorityInput.value = current;
        commitPriorityChange(targetClass);
      };

      const arrowUp = document.createElement("button");
      arrowUp.type = "button";
      arrowUp.className = "priority-arrow arrow-up";
      arrowUp.setAttribute("aria-label", "優先度を下げる");
      arrowUp.textContent = "▲";
      arrowUp.addEventListener("click", () => changePriorityBy(-1, "arrow-up"));

      const arrowDown = document.createElement("button");
      arrowDown.type = "button";
      arrowDown.className = "priority-arrow arrow-down";
      arrowDown.setAttribute("aria-label", "優先度を上げる");
      arrowDown.textContent = "▼";
      arrowDown.addEventListener("click", () => changePriorityBy(1, "arrow-down"));

      priorityArrows.appendChild(arrowUp);
      priorityArrows.appendChild(arrowDown);
      priorityWrap.appendChild(priorityArrows);
      controls.appendChild(priorityWrap);

      // ピンチェック
      const pinCheckbox = document.createElement("input");
      pinCheckbox.type = "checkbox";
      pinCheckbox.className = "pin-checkbox";
      pinCheckbox.checked = !!memo.is_pinned;
      pinCheckbox.title = "ピン留め";
      pinCheckbox.addEventListener("change", () => {
        updateMemo(memo.id, { is_pinned: pinCheckbox.checked });
      });
      controls.appendChild(pinCheckbox);

      // 編集ボタン
      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "icon-btn edit-btn";
      editBtn.textContent = "✏️";
      editBtn.title = "編集";
      editBtn.addEventListener("click", () => toggleEditMode(wrapper, memo));
      controls.appendChild(editBtn);

      // 削除ボタン
      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "icon-btn delete-btn";
      deleteBtn.textContent = "🗑";
      deleteBtn.title = "削除";
      deleteBtn.addEventListener("click", () => deleteMemo(memo.id));
      controls.appendChild(deleteBtn);

      header.appendChild(controls);

      // 一括削除チェック
      const bulkWrap = document.createElement("div");
      bulkWrap.className = "bulk-checkbox-wrap";

      const bulkCheckbox = document.createElement("input");
      bulkCheckbox.type = "checkbox";
      bulkCheckbox.className = "bulk-delete-checkbox";
      bulkCheckbox.value = memo.id;
      bulkWrap.appendChild(bulkCheckbox);

      header.appendChild(bulkWrap);
      wrapper.appendChild(header);

      const content = document.createElement("p");
      content.textContent = memo.content || "";
      wrapper.appendChild(content);

      const meta = document.createElement("small");
      const created = memo.created_at ? new Date(memo.created_at) : null;
      meta.textContent = `作成日時: ${created ? created.toLocaleString('ja-JP') : "不明"}`;
      wrapper.appendChild(meta);

      return wrapper;
    }

    function toggleEditMode(memoElement, memo) {
      const isEditing = memoElement.classList.contains("editing");

      // Clean up previous edit/view states
      const oldTitle = memoElement.querySelector("strong, .edit-title-input");
      const oldContent = memoElement.querySelector("p, .edit-content-textarea");
      const oldControls = memoElement.querySelector(".edit-controls");

      if (isEditing) {
        // --- 編集モードを終了（キャンセル） ---
        memoElement.classList.remove("editing");

        const title = document.createElement("strong");
        title.textContent = memo.title || "無題のメモ";
        if (oldTitle) oldTitle.replaceWith(title);

        const content = document.createElement("p");
        content.textContent = memo.content || "";
        if(oldContent) oldContent.replaceWith(content);

        if (oldControls) oldControls.remove();

      } else {
        // --- 編集モードを開始 ---
        memoElement.classList.add("editing");

        const titleInput = document.createElement("input");
        titleInput.type = "text";
        titleInput.className = "edit-title-input";
        titleInput.value = memo.title;
        if (oldTitle) oldTitle.replaceWith(titleInput);


        const contentArea = document.createElement("textarea");
        contentArea.className = "edit-content-textarea";
        contentArea.rows = "4";
        contentArea.value = memo.content;
        if(oldContent) oldContent.replaceWith(contentArea);

        const editControls = document.createElement("div");
        editControls.className = "edit-controls";

        const saveBtn = document.createElement("button");
        saveBtn.className = "primary-btn";
        saveBtn.textContent = "保存";
        saveBtn.onclick = async () => {
          const newTitle = titleInput.value;
          const newContent = contentArea.value;
          await updateMemo(memo.id, { title: newTitle, content: newContent });
          // The memo list will be re-fetched by updateMemo, so we don't need to do anything else.
        };

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "ghost-btn";
        cancelBtn.textContent = "キャンセル";
        cancelBtn.onclick = () => {
             // Re-create the element to revert changes
            const newMemoElement = createMemoElement(memo);
            memoElement.replaceWith(newMemoElement);
        };

        editControls.appendChild(saveBtn);
        editControls.appendChild(cancelBtn);
        memoElement.appendChild(editControls);
        titleInput.focus();
      }
    }


    async function updateMemo(id, data) {
      if ("priority" in data && (data.priority === "" || data.priority === null)) {
        data.priority = null;
      }
      try {
        await localApiRequest("PUT", `${API_URL_BASE}/${id}`, data);
        await searchMemos();
        return true;
      } catch (err) {
        console.error(err);
        alert("メモの更新に失敗しました。");
        return false;
      }
    }

    async function addMemo() {
      const titleEl = document.getElementById("title");
      const contentEl = document.getElementById("content");
      const priorityEl = document.getElementById("add-priority");

      const payload = {
        title: titleEl.value.trim(),
        content: contentEl.value.trim(),
        is_pinned: document.getElementById("add-is-pinned").checked,
        priority: priorityEl.value
      };

      if (!payload.content) {
        alert("本文を入力してください。");
        return;
      }

      try {
        await localApiRequest("POST", API_URL_BASE, payload);
        titleEl.value = "";
        contentEl.value = "";
        document.getElementById("add-is-pinned").checked = false;
        priorityEl.value = "";
        searchMemos();
      } catch (err) {
        console.error(err);
        alert("メモの追加に失敗しました。");
      }
    }

    async function deleteMemo(id) {
      if (!confirm("このメモを削除しますか？")) return;
      try {
        await localApiRequest("DELETE", `${API_URL_BASE}/${id}`);
        searchMemos();
      } catch (err) {
        console.error(err);
        alert("メモの削除に失敗しました。");
      }
    }

    function toggleBulkDeleteMode(forceValue) {
      if (typeof forceValue === "boolean") {
        isBulkDeleteMode = forceValue;
      } else {
        isBulkDeleteMode = !isBulkDeleteMode;
      }
      document.body.classList.toggle("bulk-delete-mode", isBulkDeleteMode);
      document.getElementById("bulk-delete-actions").hidden = !isBulkDeleteMode;
      document.getElementById("bulk-delete-toggle-btn").textContent =
        isBulkDeleteMode ? "通常モード" : "選択モード";
      if (!isBulkDeleteMode) deselectAll();
    }

    function deselectAll() {
      document
        .querySelectorAll('#memo-list .bulk-delete-checkbox:checked')
        .forEach((cb) => { cb.checked = false; });
    }

    async function deleteSelectedMemos() {
      const checked = [...document.querySelectorAll('#memo-list .bulk-delete-checkbox:checked')];
      if (checked.length === 0) {
        alert("削除するメモを選択してください。");
        return;
      }
      if (!confirm(`${checked.length}件のメモを削除しますか？`)) return;

      try {
        await localApiRequest("DELETE", `${API_URL_BASE}/bulk`, { ids: checked.map((cb) => cb.value) });
        toggleBulkDeleteMode(false);
        searchMemos();
      } catch (err) {
        console.error(err);
        alert("一括削除に失敗しました。");
      }
    }

    function searchMemos() {
      return fetchMemos({
        keyword: document.getElementById("search").value.trim(),
        searchType: document.getElementById("search-type").value,
        startDate: document.getElementById("start-date").value,
        endDate: document.getElementById("end-date").value
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("add-memo-btn").addEventListener("click", addMemo);
      document.getElementById("search-btn").addEventListener("click", searchMemos);
      document.getElementById("bulk-delete-toggle-btn").addEventListener("click", () => toggleBulkDeleteMode());
      document.getElementById("bulk-deselect-btn").addEventListener("click", deselectAll);
      document.getElementById("bulk-delete-btn").addEventListener("click", deleteSelectedMemos);
      document.getElementById("bulk-cancel-btn").addEventListener("click", () => toggleBulkDeleteMode(false));
      document.getElementById("search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          searchMemos();
        }
      });
      searchMemos();
    });
  </script>
    <script src="static/js/app_settings_apply.js"></script>
</body>
</html>
